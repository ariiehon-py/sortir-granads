name = "granads-sortir"
main = "src/worker.js"
compatibility_date = "2026-10-22"
upload_source_maps = true

[observability]
enabled = true

[[containers]]
class_name = "SortirContainer"
image = "./Dockerfile"
max_instances = 1

[[durable_objects.bindings]]
name = "SORTIR_CONTAINER"
class_name = "SortirContainer"

[exports.SortirContainer]
type = "durable-object"
storage = "sqlite"
