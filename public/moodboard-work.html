<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Granads — Moodboard Work</title>
<link rel="icon" href="/assets/favicon/favicon.ico" type="image/x-icon"/><link rel="apple-touch-icon" href="/assets/logo/logo.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#2A2A2E;font-family:'Space Grotesk',sans-serif}
#canvas{position:absolute;top:0;left:0;width:6000px;height:6000px;background:#3A3A3E;transform-origin:0 0}
#canvas.dragging{cursor:grabbing}
.mb-item{position:absolute;cursor:move;box-shadow:0 4px 20px rgba(0,0,0,.3);border:2px solid transparent;transition:border-color .1s}
.mb-item:hover{border-color:rgba(255,255,255,.3)}
.mb-item.selected{border-color:var(--granads-primary)}
.mb-item img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.mb-item .resize{position:absolute;bottom:-6px;right:-6px;width:12px;height:12px;background:white;border-radius:50%;cursor:nwse-resize;border:2px solid #333}
.mb-item .crop-handle{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:12px;height:12px;background:var(--granads-primary);border-radius:50%;cursor:n-resize;border:2px solid white;display:none}
.mb-item.croping .crop-handle{display:block}
.guide{position:absolute;background:var(--granads-primary);z-index:999;pointer-events:none}
.guide-h{height:1px;width:100%}
.guide-w{width:1px;height:100%}
#toolbar{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:rgba(30,30,30,.9);backdrop-filter:blur(8px);border-radius:12px;padding:8px 12px;display:flex;gap:6px;z-index:50;border:1px solid rgba(255,255,255,.1);flex-wrap:wrap;max-width:calc(100vw - 32px);justify-content:center}
#toolbar button{padding:6px 12px;border-radius:8px;border:none;background:transparent;color:white;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
#toolbar button:hover{background:rgba(255,255,255,.15)}
#toolbar button.active{background:var(--granads-primary)}
.toolbar-sep{width:1px;background:rgba(255,255,255,.2);margin:0 4px}
@media(max-width:600px){
  #toolbar{top:8px;padding:6px 8px;gap:4px}
  #toolbar button{padding:5px 8px;font-size:11px}
  .toolbar-sep{display:none}
}
#zoomInfo{position:fixed;bottom:16px;right:16px;background:rgba(30,30,30,.8);color:white;padding:6px 12px;border-radius:8px;font-size:11px;z-index:50}
#addMenu{display:none;position:fixed;top:50px;left:50%;transform:translateX(-50%);background:white;border-radius:12px;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.3);z-index:60;min-width:300px;max-width:calc(100vw - 48px)}
#addMenu label{font-size:12px;font-weight:600;color:#666;display:block;margin-bottom:4px}
#addMenu input{width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:8px;font-size:13px;margin-bottom:10px}
#addMenu .btn-row{display:flex;gap:6px;justify-content:flex-end}
@media(max-width:600px){
  #addMenu{min-width:auto;width:calc(100vw - 48px);top:70px}
  #zoomInfo{bottom:8px;right:8px;font-size:10px;padding:4px 8px}
}
</style>
</head>
<body>

<div id="toolbar">
  <button onclick="document.getElementById('fileInput').click()">+ Foto</button>
  <button onclick="showAddUrl()">+ URL</button>
  <div class="toolbar-sep"></div>
  <button id="btnSelect" class="active" onclick="setTool('select')">Select</button>
  <button id="btnPan" onclick="setTool('pan')">Pan</button>
  <div class="toolbar-sep"></div>
  <button onclick="deleteSelected()">Hapus</button>
  <button onclick="toggleCrop()">Crop</button>
  <div class="toolbar-sep"></div>
  <button onclick="zoomIn()">+</button>
  <button onclick="zoomOut()">−</button>
  <button onclick="zoomFit()">Fit</button>
  <div class="toolbar-sep"></div>
  <button onclick="saveBoard()">Simpan</button>
  <a href="/moodboard" style="padding:6px 12px;border-radius:8px;background:transparent;color:white;font-size:12px;font-weight:600;text-decoration:none">Kembali</a>
</div>

<div id="addMenu">
  <label>Tambah dari URL</label>
  <input id="urlInput" placeholder="https://..."/>
  <div class="btn-row">
    <button class="btn small ghost" onclick="document.getElementById('addMenu').style.display='none'" style="color:#333">Batal</button>
    <button class="btn small" onclick="addFromUrl()">Tambah</button>
  </div>
</div>

<input type="file" id="fileInput" multiple accept="image/*" style="display:none" onchange="addFiles(this.files)"/>

<div id="canvas"></div>
<div id="zoomInfo">100%</div>
<div id="guides"></div>

<script>
const params = new URLSearchParams(location.search);
const projectId = params.get('id');
let boards = [];
let project = null;
let items = [];

async function loadBoard(){
  boards = await fetch('/api/shoots').then(r=>r.json());
  project = boards.find(p=>p.id===projectId);
  items = project?.items || [];
  init();
}
loadBoard();

let zoom = 1, panX = 0, panY = 0;
let tool = 'select';
let dragging = null, dragStart = {x:0,y:0}, dragItemStart = {x:0,y:0};
let panning = false, panStart = {x:0,y:0}, panOffset = {x:0,y:0};
let selectedItem = null;
let resizing = null, resizeStart = {x:0,y:0}, resizeItemStart = {w:0,h:0};
let cropping = null, cropStart = {x:0,y:0}, cropItemStart = {top:0};
let guides = [];

const canvas = document.getElementById('canvas');

function init(){
  if(!project){
    document.body.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:white;text-align:center"><div><h2>Project tidak ditemukan</h2><a href="/moodboard" style="color:var(--granads-primary)">Kembali</a></div></div>`;
    return;
  }
  renderItems();
  setupEvents();
}

function renderItems(){
  canvas.innerHTML = '';
  items.forEach((item, i) => {
    const el = document.createElement('div');
    el.className = 'mb-item' + (selectedItem===i?' selected':'');
    el.style.cssText = `left:${item.x}px;top:${item.y}px;width:${item.w}px;height:${item.h}px;`;
    el.dataset.index = i;
    el.innerHTML = `<img src="${item.src}" draggable="false"/><div class="resize"></div><div class="crop-handle"></div>`;
    canvas.appendChild(el);
  });
  updateTransform();
}

function updateTransform(){
  canvas.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
  document.getElementById('zoomInfo').textContent = Math.round(zoom*100)+'%';
}

function setupEvents(){
  canvas.addEventListener('mousedown', onMouseDown);
  document.addEventListener('mousemove', onMouseMove);
  document.addEventListener('mouseup', onMouseUp);
  canvas.addEventListener('wheel', onWheel, {passive:false});
  document.addEventListener('keydown', onKeyDown);
}

function onMouseDown(e){
  if(e.target.id==='canvas' || e.target===canvas){
    if(tool==='pan'){
      panning=true;
      panStart={x:e.clientX,y:e.clientY};
      panOffset={x:panX,y:panY};
      canvas.classList.add('dragging');
    } else {
      selectedItem=null;
      renderItems();
    }
    return;
  }

  const itemEl = e.target.closest('.mb-item');
  if(!itemEl) return;
  const idx = parseInt(itemEl.dataset.index);
  selectedItem = idx;
  renderItems();

  if(e.target.classList.contains('resize')){
    resizing = idx;
    resizeStart = {x:e.clientX,y:e.clientY};
    resizeItemStart = {w:items[idx].w, h:items[idx].h};
    e.preventDefault();
    return;
  }

  if(e.target.classList.contains('crop-handle')){
    cropping = idx;
    cropStart = {x:e.clientX,y:e.clientY};
    cropItemStart = {top: items[idx].cropTop||0};
    itemEl.classList.add('croping');
    e.preventDefault();
    return;
  }

  dragging = idx;
  dragStart = {x:e.clientX,y:e.clientY};
  dragItemStart = {x:items[idx].x, y:items[idx].y};
}

function onMouseMove(e){
  if(panning){
    panX = panOffset.x + (e.clientX - panStart.x);
    panY = panOffset.y + (e.clientY - panStart.y);
    updateTransform();
    return;
  }

  if(dragging !== null){
    const dx = (e.clientX - dragStart.x) / zoom;
    const dy = (e.clientY - dragStart.y) / zoom;
    items[dragging].x = dragItemStart.x + dx;
    items[dragging].y = dragItemStart.y + dy;
    showGuides(dragging);
    renderItems();
    return;
  }

  if(resizing !== null){
    const dx = (e.clientX - resizeStart.x) / zoom;
    const dy = (e.clientY - resizeStart.y) / zoom;
    const item = items[resizing];
    const ratio = item.origRatio || (item.w / item.h);
    item.w = Math.max(80, resizeItemStart.w + dx);
    item.h = item.w / ratio;
    renderItems();
    return;
  }

  if(cropping !== null){
    const dy = (e.clientY - cropStart.y) / zoom;
    items[cropping].cropTop = Math.max(0, cropItemStart.top + dy);
    renderItems();
    return;
  }
}

function onMouseUp(){
  if(dragging !== null) hideGuides();
  dragging = null;
  panning = false;
  resizing = null;
  cropping = null;
  canvas.classList.remove('dragging');
  document.querySelectorAll('.mb-item.croping').forEach(el=>el.classList.remove('croping'));
}

function onWheel(e){
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.1 : 0.1;
  const newZoom = Math.max(0.1, Math.min(5, zoom + delta));
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  panX -= mx * (newZoom - zoom);
  panY -= my * (newZoom - zoom);
  zoom = newZoom;
  updateTransform();
}

function onKeyDown(e){
  if(e.key==='Delete'||e.key==='Backspace'){
    if(selectedItem !== null && document.activeElement.tagName!=='INPUT'){
      deleteSelected();
    }
  }
  if(e.key==='Escape'){
    selectedItem = null;
    renderItems();
  }
}

function showGuides(idx){
  const el = document.getElementById('guides');
  el.innerHTML = '';
  const item = items[idx];
  const cx = item.x + item.w/2;
  const cy = item.y + item.h/2;
  const threshold = 5;

  items.forEach((other, i)=>{
    if(i===idx) return;
    const ox = other.x + other.w/2;
    const oy = other.y + other.h/2;

    if(Math.abs(cx - ox) < threshold){
      const line = document.createElement('div');
      line.className = 'guide guide-w';
      line.style.left = ox + 'px';
      line.style.top = '0';
      el.appendChild(line);
    }
    if(Math.abs(cy - oy) < threshold){
      const line = document.createElement('div');
      line.className = 'guide guide-h';
      line.style.top = oy + 'px';
      line.style.left = '0';
      el.appendChild(line);
    }
    if(Math.abs(item.x - other.x) < threshold){
      const line = document.createElement('div');
      line.className = 'guide guide-w';
      line.style.left = other.x + 'px';
      el.appendChild(line);
    }
    if(Math.abs(item.y - other.y) < threshold){
      const line = document.createElement('div');
      line.className = 'guide guide-h';
      line.style.top = other.y + 'px';
      el.appendChild(line);
    }
    if(Math.abs(item.x + item.w - (other.x + other.w)) < threshold){
      const line = document.createElement('div');
      line.className = 'guide guide-w';
      line.style.left = (other.x + other.w) + 'px';
      el.appendChild(line);
    }
  });
}

function hideGuides(){ document.getElementById('guides').innerHTML = ''; }

function setTool(t){
  tool = t;
  document.getElementById('btnSelect').classList.toggle('active', t==='select');
  document.getElementById('btnPan').classList.toggle('active', t==='pan');
  canvas.style.cursor = t==='pan'?'grab':'default';
}

function addFiles(files){
  Array.from(files).forEach(f=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 400;
        const scale = img.width > maxW ? maxW / img.width : 1;
        items.push({
          src: e.target.result,
          x: 200 + Math.random()*400,
          y: 200 + Math.random()*400,
          w: img.width * scale,
          h: img.height * scale,
          origRatio: img.width / img.height,
          cropTop: 0
        });
        renderItems();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(f);
  });
}

function showAddUrl(){
  document.getElementById('addMenu').style.display='block';
  document.getElementById('urlInput').value='';
  document.getElementById('urlInput').focus();
}

function addFromUrl(){
  const url = document.getElementById('urlInput').value.trim();
  if(!url) return;
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = ()=>{
    const maxW = 400;
    const scale = img.width > maxW ? maxW / img.width : 1;
    items.push({
      src: url,
      x: 200 + Math.random()*400,
      y: 200 + Math.random()*400,
      w: img.width * scale,
      h: img.height * scale,
      origRatio: img.width / img.height,
      cropTop: 0
    });
    renderItems();
    document.getElementById('addMenu').style.display='none';
  };
  img.onerror = ()=>alert('Gagal load gambar dari URL');
  img.src = url;
}

function deleteSelected(){
  if(selectedItem===null) return;
  items.splice(selectedItem, 1);
  selectedItem = null;
  renderItems();
}

function toggleCrop(){
  if(selectedItem===null) return alert('Pilih foto dulu');
  const el = document.querySelector(`.mb-item[data-index="${selectedItem}"]`);
  if(el) el.classList.toggle('croping');
}

function zoomIn(){ zoom = Math.min(5, zoom+0.2); updateTransform(); }
function zoomOut(){ zoom = Math.max(0.1, zoom-0.2); updateTransform(); }
function zoomFit(){ zoom=1; panX=0; panY=0; updateTransform(); }

async function saveBoard(){
  if(!project) return;
  project.items = items;
  await fetch(`/api/shoots/${projectId}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({items})});
  alert('Tersimpan!');
}
</script>
</body>
</html>
