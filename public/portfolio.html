<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Granads — Photography</title>
<link rel="icon" href="/assets/logo/favicon.ico" type="image/x-icon"/><link rel="apple-touch-icon" href="/assets/logo/logo.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --granads-primary:#8C0009;
  --granads-gold:#C9A86A;
  --granads-dark:#1A1A1E;
  --granads-cream:#FFF9F0;
  --border:#E8E0D6;
  --muted:#6B7280;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Space Grotesk',system-ui,sans-serif}
html{scroll-behavior:smooth}
html{scrollbar-gutter:stable}
body{background:var(--granads-cream);color:var(--granads-dark);overflow-x:hidden}
/* syahdu scroll transitions */
@media (prefers-reduced-motion: no-preference){
  html{scroll-behavior:smooth}
  .reveal{opacity:0;transform:translateY(28px);transition:opacity .9s cubic-bezier(0.22,1,0.36,1), transform .9s cubic-bezier(0.22,1,0.36,1)}
  .reveal.in{opacity:1;transform:none}
  .hero h1{animation:heroIn .9s cubic-bezier(0.22,1,0.36,1) both}
  @keyframes heroIn{from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:none}}
  .show-card{transition:transform .6s cubic-bezier(0.22,1,0.36,1), box-shadow .4s ease}
}

/* NAV */
.navbar{position:fixed;top:0;left:0;right:0;z-index:50;padding:14px 28px;display:flex;justify-content:space-between;align-items:center;transition:background .3s ease,backdrop-filter .3s ease,transform .4s ease,border-color .3s ease}
.navbar.scrolled{background:rgba(255,249,240,.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);box-shadow:0 4px 24px rgba(0,0,0,.06)}
.navbar.hide{transform:translateY(-100%)}
.nav-brand{font-weight:800;font-size:15px;letter-spacing:.12em;color:var(--granads-primary)}
.nav-brand span{color:var(--granads-gold)}
.nav-links{display:flex;gap:6px}
.nav-links a{text-decoration:none;font-size:13px;padding:7px 13px;border-radius:999px;color:var(--granads-dark);transition:.2s;font-weight:500}
.nav-links a:hover{background:var(--granads-primary);color:white}
/* Hamburger */
.p-hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:8px;border-radius:8px;background:none;border:none}
.p-hamburger span{display:block;width:22px;height:2px;background:var(--granads-dark);border-radius:2px;transition:transform .3s,opacity .3s}
.p-hamburger.open span:nth-child(1){transform:rotate(45deg) translate(5px,5px)}
.p-hamburger.open span:nth-child(2){opacity:0}
.p-hamburger.open span:nth-child(3){transform:rotate(-45deg) translate(5px,-5px)}
.p-mobile-nav{display:none;position:fixed;top:60px;left:0;right:0;background:rgba(255,249,240,.98);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:12px 24px;z-index:55;flex-direction:column;gap:4px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.p-mobile-nav.show{display:flex}
.p-mobile-nav a{text-decoration:none;padding:12px 16px;border-radius:12px;font-size:14px;font-weight:500;color:var(--granads-dark);transition:background .2s}
.p-mobile-nav a:hover{background:var(--granads-primary);color:white}
@media(max-width:768px){
  .navbar{padding:10px 16px}
  .nav-links{display:none}
  .p-hamburger{display:flex}
}

/* FIRST VIEWPORT: hero + showcase — rapetin gap */
.first{display:flex;flex-direction:column;justify-content:flex-start;padding-top:72px;padding-bottom:24px}
.hero{margin-bottom:18px}
.hero{padding:10px 24px 0;text-align:center}
.hero-tag{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--granads-gold);font-weight:700;margin-bottom:8px}
.hero h1{font-size:clamp(18px,2.6vw,28px);font-weight:600;line-height:1.45;max-width:640px;margin:0 auto;color:var(--granads-dark)}
.hero h1 b{color:var(--granads-primary)}
.hero-cta{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.btn{padding:9px 18px;border-radius:999px;font-size:13px;font-weight:600;text-decoration:none;cursor:pointer;border:none;transition:.2s;display:inline-flex;align-items:center;gap:8px}
.btn-primary{background:var(--granads-primary);color:white}
.btn-outline{background:transparent;color:var(--granads-primary);border:1.5px solid var(--granads-primary)}

/* SHOWCASE — 10 kartu, mentok kanan-kiri */
.showcase{position:relative;display:flex;flex-direction:column;margin-top:24px;flex:0 0 auto}
.show-viewport{position:relative;overflow:hidden;padding:0 0 12px;max-width:100%;margin:0;width:100%}
.show-row{display:flex;align-items:stretch;justify-content:flex-start;overflow-x:auto;padding:8px 0 20px 0;scrollbar-width:none;gap:0}
.show-row::-webkit-scrollbar{display:none}
.show-card{flex:0 0 clamp(260px,21vw,320px);border-radius:12px;overflow:hidden;position:relative;box-shadow:0 10px 28px rgba(0,0,0,.12);transition:transform .25s}
.show-card + .show-card{margin-left:-28px}
.show-card:nth-child(odd){transform:rotate(-1.5deg) translateY(6px)}
.show-card:nth-child(even){transform:rotate(1.2deg)}
.show-card{animation:goyang 4.2s ease-in-out infinite}
.show-card:nth-child(even){animation:goyangEven 4.2s ease-in-out infinite}
.show-card:nth-child(3n){animation-delay:.3s}
.show-card:nth-child(4n){animation-delay:.6s}
.show-card:hover{transform:rotate(0) translateY(-8px) scale(1.06) !important;z-index:10;animation-play-state:paused;box-shadow:0 16px 40px rgba(0,0,0,.22)}
.show-card:active{transform:rotate(0) translateY(-12px) scale(1.14) !important;z-index:20;animation-play-state:paused;box-shadow:0 20px 50px rgba(0,0,0,.3);filter:brightness(1.08) contrast(1.1)}
.show-card.center{transform:rotate(0) translateY(-10px) scale(1.04);z-index:15;box-shadow:0 16px 36px rgba(0,0,0,.18);animation:goyangCenter 3s ease-in-out infinite}
@keyframes goyang{0%,100%{transform:rotate(-1.5deg) translateY(6px)}50%{transform:rotate(-1deg) translateY(2px)}}
@keyframes goyangEven{0%,100%{transform:rotate(1.2deg) translateY(0)}50%{transform:rotate(1.6deg) translateY(4px)}}
@keyframes goyangCenter{0%,100%{transform:rotate(0) translateY(-10px) scale(1.04)}50%{transform:rotate(0.6deg) translateY(-6px) scale(1.04)}}
.show-card .ph{width:100%;height:clamp(420px,46vh,500px);display:flex;align-items:flex-end;padding:16px;font-weight:800;font-size:20px;line-height:1.1;color:rgba(255,255,255,.92)}
.show-card small{display:block;font-size:11px;font-weight:500;opacity:.85;margin-top:4px}
.show-arrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:white;cursor:pointer;font-size:20px;z-index:20;box-shadow:0 4px 14px rgba(0,0,0,.1);transition:all .2s;display:flex;align-items:center;justify-content:center}
.show-arrow:hover{background:var(--granads-primary);color:white;border-color:var(--granads-primary)}
#showPrev{left:12px}#showNext{right:12px}
@media(max-width:1100px){
  .show-card{flex-basis:clamp(260px,32vw,340px)}
  .show-card .ph{height:360px}
}
@media(max-width:768px){
  .show-card{flex-basis:65vw}
  .show-card + .show-card{margin-left:-20px}
  .show-card .ph{height:300px;font-size:18px}
  .show-arrow{width:36px;height:36px;font-size:18px}
  #showPrev{left:6px}
  #showNext{right:6px}
}
@media(max-width:480px){
  .show-card{flex-basis:70vw}
  .show-card .ph{height:260px;font-size:16px}
  .show-arrow{width:32px;height:32px;font-size:16px}
}

/* SECTIONS */
section{padding:72px 24px}
#about{padding:32px 24px 48px}
.section-inner{max-width:1000px;margin:0 auto}
.section-label{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--granads-gold);font-weight:700;margin-bottom:8px}
.section-title{font-size:clamp(22px,4vw,32px);font-weight:800;margin-bottom:12px}
.section-desc{color:var(--muted);font-size:14px;line-height:1.6;max-width:600px}
@media(max-width:768px){section{padding:48px 16px}#about{padding:24px 16px 36px}}
/* ABOUT — 2 foto owner */
.about-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center}
.about-photos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.about-photo{aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:#E8E0D6;position:relative;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.about-photo .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:800;color:white;font-size:22px}
.about-photo:nth-child(2){transform:translateY(18px)}
.about-text h3{font-size:20px;font-weight:800;margin-bottom:10px}
.about-text p{font-size:13px;line-height:1.7;color:var(--muted);margin-bottom:12px}
.about-stats{display:flex;gap:18px;margin-top:16px}
.about-stats b{font-size:20px;color:var(--granads-primary)}
.about-stats span{font-size:11px;color:var(--muted)}
@media(max-width:768px){.about-grid{grid-template-columns:1fr}.about-photo:nth-child(2){transform:none}}
/* SERVICES */
.services-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:22px}
.service-card{background:white;border:1px solid var(--border);border-radius:16px;padding:20px;transition:.2s;flex:0 1 calc(33.333% - 10px);min-width:240px;max-width:320px}
.service-card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.08);border-color:var(--granads-gold)}
.service-card h4{font-size:14px;font-weight:800;margin-bottom:6px}
.service-card p{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:12px}
.service-card .price{font-size:13px;font-weight:800;color:var(--granads-primary)}
@media(max-width:900px){.service-card{flex:1 1 calc(50% - 10px)}}
@media(max-width:600px){.service-card{flex:1 1 100%;max-width:100%}}
/* TESTI */
.testi-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:22px}
.testi-card{background:white;border:1px solid var(--border);border-radius:16px;padding:18px;flex:0 1 calc(33.333% - 10px);min-width:260px;max-width:340px}
.testi-card .stars{color:var(--granads-gold);font-size:12px;margin-bottom:8px}
.testi-card p{font-size:13px;line-height:1.6;color:var(--granads-dark)}
.testi-card .who{margin-top:12px;font-size:12px;font-weight:700}
.testi-card .who span{font-weight:400;color:var(--muted)}
@media(max-width:900px){.testi-card{flex:1 1 100%;max-width:100%}}
.testi-cta{text-align:center;margin-top:22px}

/* CALENDAR — same as workspace */
.cal-top{display:flex;justify-content:space-between;align-items:center;margin:24px 0 14px;flex-wrap:wrap;gap:10px}
.month-nav{display:flex;align-items:center;gap:12px}
.month-nav button{background:white;border:1px solid var(--border);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.month-nav button:hover{background:var(--granads-primary);color:white;border-color:var(--granads-primary)}
.month-nav b{font-size:16px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:var(--border);border-radius:12px;overflow:hidden}
.cal-head{background:var(--granads-primary);color:white;padding:8px 4px;font-size:11px;font-weight:700;text-align:center;text-transform:uppercase;letter-spacing:.04em}
.cal-day{background:white;padding:8px 4px;min-height:70px;font-size:12px}
.cal-day.today{border:2px solid var(--granads-primary)}
.cal-day.empty{background:#F9FAFB}
.cal-day .num{font-weight:600;margin-bottom:4px}
.cal-event{font-size:10px;padding:2px 4px;border-radius:4px;margin-top:2px;background:var(--granads-primary);color:white;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.schedule-list{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.schedule-item{background:white;border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.schedule-item .info{flex:1;min-width:200px}
.hint{font-size:12px;color:var(--muted)}
@media(max-width:600px){
  .cal-head{padding:6px 2px;font-size:9px}
  .cal-day{min-height:48px;padding:4px 2px;font-size:10px}
  .cal-event{font-size:8px;padding:1px 3px}
}

/* PRICELIST */
.pricing-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-top:28px}
.price-card{background:white;border:1px solid var(--border);border-radius:16px;padding:26px 22px;text-align:center;position:relative}
.price-card.featured{border-color:var(--granads-gold);box-shadow:0 8px 32px rgba(201,168,106,.2)}
.price-card.featured::before{content:'POPULER';position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--granads-gold);color:white;padding:4px 16px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.08em}
.price-card .price{font-size:30px;font-weight:800;color:var(--granads-primary);margin:14px 0 6px}
.price-card ul{list-style:none;text-align:left;margin:18px 0;padding:0}
.price-card li{padding:8px 0;font-size:13px;color:var(--muted);border-bottom:1px solid #F3F0EB;display:flex;gap:8px;align-items:center}
.price-card li::before{content:'✓';color:var(--granads-primary);font-weight:700;font-size:12px}
@media(max-width:768px){.pricing-grid{grid-template-columns:1fr}}

/* IG GRID — dinamis, embed */
#igGrid .instagram-media{max-width:100%!important;min-width:0!important;width:100%!important;margin:0 auto!important}
/* FOOTER SIMPLE — like screenshot, keep it simple + ig/wa */
.simple-footer{text-align:center;padding:22px 24px;border-top:1px solid #E8E0D6;background:var(--granads-cream);color:var(--muted);font-size:12px}
.simple-footer .footer-brand{font-family:Georgia,'Times New Roman',serif;font-size:22px;font-weight:800;color:var(--granads-primary);letter-spacing:-.02em;line-height:1}
.simple-footer .footer-brand .footer-copy{font-family:'Space Grotesk',system-ui,sans-serif;font-size:11px;font-weight:400;color:#6B6B6B;letter-spacing:0;margin-left:6px;vertical-align:middle}
.simple-footer .footer-brand .footer-copy a{color:var(--granads-primary);text-decoration:underline;text-underline-offset:3px;font-weight:600}
.simple-footer .footer-socials{display:flex;gap:18px;justify-content:center;align-items:center;margin-top:12px}
.simple-footer .footer-socials a{display:inline-flex;align-items:center;justify-content:center;background:transparent;border:none;text-decoration:none;line-height:0;transition:.2s;opacity:1}
.simple-footer .footer-socials a:hover{opacity:.7;transform:translateY(-1px)}
.simple-footer .footer-socials svg{width:22px;height:22px;fill:var(--granads-primary);display:block}
</style>
</head>
<body>

  <div class="nav-links">
    <a href="#porto">Porto</a>
    <a href="#jadwal">Jadwal</a>
    <a href="/book">Book</a>
  </div>

    <span></span><span></span><span></span>
  </button>
</nav>
<div class="p-mobile-nav" id="pMobileNav">
  <a href="#porto" onclick="closePMobileNav()">Porto</a>
  <a href="#jadwal" onclick="closePMobileNav()">Jadwal</a>

</div>

<div class="first">

  </div>
</div>

<section id="testi" class="reveal" style="display:none">
  <div class="section-inner">

<section id="jadwal" class="reveal">

    <div class="calendar" id="calendar"></div>
    <div class="schedule-list" id="scheduleList"></div>
  </div>
</section>

<section id="ig" class="reveal" style="padding:28px 24px 32px">
  <div class="section-inner" style="max-width:1100px">
    <div id="igGrid" style="display:flex;flex-wrap:wrap;justify-content:center;gap:16px;align-items:start"></div>
    <div id="igHint" class="hint" style="margin-top:10px;text-align:center"></div>
  </div>
</section>

<script>
// syahdu: navbar hide on scroll down, show on up + reveal observer
let lastY=window.scrollY;
window.addEventListener('scroll',()=>{
  const y=window.scrollY;
  const nav=document.getElementById('navbar');
  nav.classList.toggle('scrolled', y > 40);
  if(y>200 && y>lastY+6) nav.classList.add('hide');
  else nav.classList.remove('hide');
  lastY=y;
},{passive:true});

// Hamburger mobile nav
function togglePMobileNav(){
  document.getElementById('pHamburger').classList.toggle('open');
  document.getElementById('pMobileNav').classList.toggle('show');
}
function closePMobileNav(){
  document.getElementById('pHamburger').classList.remove('open');
  document.getElementById('pMobileNav').classList.remove('show');
}

const ro=new IntersectionObserver((entries)=>{
  entries.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('in') })
},{threshold:0.12, rootMargin:'0px 0px -40px 0px'});
document.querySelectorAll('.reveal').forEach(el=> ro.observe(el));

// --- SHOWCASE (dari /api/showcase — upload via Owner Dashboard) ---
const fallbackShots = [
  {t:'THE CADO', s:'Co-Founder Portrait', bg:'linear-gradient(135deg,#0E9F6E,#D4F565)', c:'#08351f'},
  {t:'IRIDESCENT', s:'Creative Print', bg:'linear-gradient(135deg,#c084fc,#f0abfc,#fef08a)', c:'#3b0764'},
  {t:'LIGHT / GROVE', s:'Packaging', bg:'linear-gradient(135deg,#fb7185,#fdba74)', c:'#431407'},
  {t:'FLORE', s:'Editorial', bg:'linear-gradient(135deg,#c4b5fd,#f9a8d4)', c:'#2e1065'},
  {t:'BABA NANA', s:'Brand Shoot', bg:'linear-gradient(135deg,#fde047,#86efac)', c:'#14532d'},
  {t:'GRANADS STUDIO', s:'Studio Session', bg:'linear-gradient(135deg,#f97316,#fde68a)', c:'#431407'},
  {t:'MOMENT & LOVE', s:'Wedding Day', bg:'linear-gradient(135deg,#8b5cf6,#ec4899)', c:'#fdf2f8'},
  {t:'FAMILY FRAME', s:'Family Portrait', bg:'linear-gradient(135deg,#06b6d4,#3b82f6)', c:'#eff6ff'},
  {t:'GRADUATION', s:'Graduation Shoot', bg:'linear-gradient(135deg,#f59e0b,#10b981)', c:'#064e3b'},
  {t:'BRAND STORY', s:'Brand Campaign', bg:'linear-gradient(135deg,#ec4899,#8b5cf6)', c:'#faf5ff'},
];
function escAttr(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
async function loadShowcase(){
  try{
    const data = await fetch('/api/showcase').then(r=>r.json());
    if(Array.isArray(data) && data.length>0){
      // sort by order
      data.sort((a,b)=>(a.order||0)-(b.order||0));
      document.getElementById('showRow').innerHTML = data.map(it=>{
        if(it.url){
          const x = it.posX ?? 50, y = it.posY ?? 50;
          return `<div class="show-card"><div class="ph" style="background:url('${escAttr(it.url)}') ${x}% ${y}%/cover no-repeat"></div></div>`;
        }
        return `<div class="show-card"><div class="ph" style="background:${it.bg||'#eee'}"></div></div>`;
      }).join('');
    } else {
      document.getElementById('showRow').innerHTML = fallbackShots.map(s=>
        `<div class="show-card"><div class="ph" style="background:${s.bg}"></div></div>`
      ).join('');
    }
  }catch{
    document.getElementById('showRow').innerHTML = fallbackShots.map(s=>
      `<div class="show-card"><div class="ph" style="background:${s.bg}"></div></div>`
    ).join('');
  }
}
async function initShowcaseScroll(){
  const row=document.getElementById('showRow');
  function updateCenter(){
    const center=row.getBoundingClientRect().left + row.offsetWidth/2;
    let best=null, bestDist=Infinity;
    row.querySelectorAll('.show-card').forEach(c=>{
      const r=c.getBoundingClientRect();
      const cc=r.left + r.width/2;
      const d=Math.abs(center-cc);
      if(d<bestDist){ bestDist=d; best=c; }
    });
    row.querySelectorAll('.show-card').forEach(c=>c.classList.remove('center'));
    if(best) best.classList.add('center');
  }
  row.addEventListener('scroll', ()=> requestAnimationFrame(updateCenter), {passive:true});
  window.addEventListener('resize', updateCenter);
  // panggil setelah load
  const obs=new MutationObserver(updateCenter);
  obs.observe(row,{childList:true});
  setTimeout(updateCenter,300);
}
loadShowcase().then(()=> initShowcaseScroll());
const showRow=document.getElementById('showRow');
const showPrev=document.getElementById('showPrev');
const showNext=document.getElementById('showNext');
showPrev.onclick=()=> showRow.scrollBy({left:-380,behavior:'smooth'});
showNext.onclick=()=> showRow.scrollBy({left:380,behavior:'smooth'});
function initInfiniteScroll(){
  const cards=showRow.querySelectorAll('.show-card');
  if(cards.length<2) return;
  // clone first & last for seamless loop
  cards.forEach(c=>{ const cl=c.cloneNode(true); cl.setAttribute('aria-hidden','true'); showRow.appendChild(cl); });
  showRow.scrollLeft=0;
  showRow.addEventListener('scroll',()=>{
    const w=showRow.scrollWidth/3;
    if(showRow.scrollLeft<=2){ showRow.scrollLeft=w; }
    if(showRow.scrollLeft>=w*2-2){ showRow.scrollLeft=w; }
  },{passive:true});
}
setTimeout(initInfiniteScroll,400);

// --- JADWAL: kalender sama kayak workspace (read-only) ---
let schedules = [];
let currentDate = new Date();
async function init(){
  try{
    schedules = await fetch('/api/public/schedules').then(r=>r.json());
  }catch{ schedules = []; }
  renderCalendar(); renderList();
}
function renderCalendar(){
  const year = currentDate.getFullYear(), month = currentDate.getMonth();
  const months = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  document.getElementById('monthTitle').textContent = `${months[month]} ${year}`;
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const today = new Date();
  let html = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'].map(h=>`<div class="cal-head">${h}</div>`).join('');
  for(let i=0;i<firstDay;i++) html += `<div class="cal-day empty"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = today.getFullYear()===year && today.getMonth()===month && today.getDate()===d;
    const ev = schedules.filter(s=>s.date===dateStr).map(s=>{
      const t = (s.time||'').slice(0,5);
      const label = t ? `${t} Booked` : 'Booked';
      const tip = t ? `${t} Booked` : 'Booked';
      return `<div class="cal-event" title="${tip}">${label}</div>`;
    }).join('');
    html += `<div class="cal-day${isToday?' today':''}"><div class="num">${d}</div>${ev}</div>`;
  }
  document.getElementById('calendar').innerHTML = html;
}
function renderList(){
  const sorted = [...schedules].sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
  const now = new Date(); now.setHours(0,0,0,0);
  const upcoming = sorted.filter(s=>new Date(s.date+'T00:00')>=now).slice(0,5);
  const el = document.getElementById('scheduleList');
  if(!upcoming.length){ el.innerHTML = `<div class="hint" style="text-align:center;padding:16px">Belum ada jadwal mendatang.</div>`; return; }
  const months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  el.innerHTML = upcoming.map(s=>{
    const d = new Date(s.date+'T'+(s.time||'00:00'));
    const t = (s.time||'').slice(0,5);
    return `<div class="schedule-item"><div class="info">
      <div style="font-weight:700;font-size:14px">${t ? t+' • Booked' : 'Booked'}</div>
      <div class="hint">${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}${t ? ' • '+t : ''}${s.location?' • '+s.location:''}</div>
    </div></div>`;
  }).join('');
}
function changeMonth(d){ currentDate.setMonth(currentDate.getMonth()+d); renderCalendar(); }
function goToday(){ currentDate = new Date(); renderCalendar(); }
function normalizeIg(u){
  if(!u) return '';
  const m=u.match(/data-instgrm-permalink="([^"]+)"/);
  if(m) u=m[1];
  const href=u.match(/https?:\/\/(www\.)?instagram\.com\/(p|reel|reels|tv)\/[^"'\s<>?]+/);
  if(href) u=href[0];
  else {
    const any=u.match(/https?:\/\/(www\.)?instagram\.com\/[^"'\s<>?]+/);
    if(any) u=any[0];
  }
  u=u.split('?')[0].split('#')[0];
  if(u && !u.endsWith('/')) u+='/';
  u=u.replace(/^http:/,'https:').replace(/^https:\/\/instagram\.com/,'https://www.instagram.com');
  return u;
}
async function loadIg(){
  const grid=document.getElementById('igGrid'); const hint=document.getElementById('igHint');
  const section=document.getElementById('ig');
  try{
    const data=await fetch('/api/ig-posts').then(r=>r.json());
    const links=(data.links||[]).filter(Boolean);
    if(!links.length){ section.style.display='none'; return; }
    section.style.display='block';
    grid.innerHTML=links.map((u,i)=>{
      const permalink=normalizeIg(u);
      if(!permalink || !/instagram\.com/.test(permalink)) return `<a href="${u}" target="_blank" style="flex:0 1 340px;max-width:360px;width:100%;border:1px solid var(--border);border-radius:12px;padding:12px;background:white;display:block;text-align:center">Buka IG ${i+1} →</a>`;
      const embedUrl = permalink + 'embed/';
      return `<div style="flex:0 1 340px;max-width:360px;width:100%;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:white"><iframe src="${embedUrl}" style="width:100%;height:520px;border:0;display:block" loading="lazy" allowtransparency="true" scrolling="no"></iframe><a href="${permalink}" target="_blank" style="display:block;padding:8px;text-align:center;font-size:11px;color:var(--granads-primary);font-weight:600;text-decoration:none">Buka di Instagram →</a></div>`;
    }).join('');
    hint.textContent='';
  }catch{ hint.textContent='Gagal memuat IG.' }
}
async function loadTesti(){
  const sec=document.getElementById('testi'); const grid=document.getElementById('testiGrid');
  try{
    const data=await fetch('/api/testimoni').then(r=>r.json());
    if(!Array.isArray(data) || !data.length){ sec.style.display='none'; return; }
    sec.style.display='block';
    grid.innerHTML=data.map(t=>`<div class="testi-card"><div class="stars">${'★'.repeat(t.stars||5)}</div><p>"${t.text}"</p><div class="who">${t.name} <span>— ${t.role||''}</span></div></div>`).join('');
  }catch{ sec.style.display='none'; }
}
init(); loadIg(); loadTesti();
</script>
