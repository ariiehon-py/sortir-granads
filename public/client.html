<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Granads — Pilih Foto</title>
<link rel="icon" href="/assets/logo/logo.png" type="image/png"/><link rel="apple-touch-icon" href="/assets/logo/logo.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
<style>
.client-header{position:sticky;top:53px;z-index:15;background:var(--granads-cream);border-bottom:1px solid var(--border);padding:12px 24px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;touch-action:pan-y}
.lightbox.open{display:flex}
.lightbox img{max-width:92vw;max-height:82vh;border-radius:12px;user-select:none}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:none;background:rgba(255,255,255,.9);font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.lb-nav:hover{background:white}
#lbPrev{left:18px}
#lbNext{right:18px}
@media(max-width:600px){.lb-nav{width:40px;height:40px;font-size:22px}#lbPrev{left:8px}#lbNext{right:8px}.client-header{padding:10px 16px}.client-header>div{flex-direction:column;align-items:flex-start!important;gap:10px!important}}
.bulk-popup{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--granads-dark);color:white;padding:12px 16px;border-radius:16px;display:none;align-items:center;gap:10px;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.25);flex-wrap:wrap;justify-content:center;max-width:95vw}
.bulk-popup.show{display:flex;animation:pop .2s ease}
@keyframes pop{from{transform:translateX(-50%) translateY(10px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
.bulk-popup .count{font-weight:800;background:var(--granads-gold);color:white;padding:4px 10px;border-radius:999px;font-size:12px}
.photo-note-wrap{padding:6px 8px;background:white;border-top:1px solid #F3F0EB}
.photo-note-wrap input{width:100%;padding:6px 10px;font-size:11px;border:1px solid var(--border);border-radius:999px;background:#FFFCF8;outline:none}
.photo-note-wrap input:focus{border-color:var(--granads-gold);background:white}
.photo-note-wrap input::placeholder{color:#9CA3AF}
.note-indicator{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.95);color:var(--granads-dark);padding:3px 8px;border-radius:999px;font-size:10px;font-weight:700;display:flex;align-items:center;gap:4px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.lb-note{position:absolute;bottom:72px;left:50%;transform:translateX(-50%);width:min(92vw,520px);display:flex;gap:8px}
.lb-note input{flex:1;padding:10px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.95);font-size:13px;outline:none}
.lb-note input:focus{border-color:var(--granads-gold)}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand" style="display:flex;align-items:center;gap:10px">
    <img src="assets/logo/logo.png" alt="Granads" style="height:32px;width:auto;object-fit:contain" onerror="this.style.display='none'"/>
  </div>
</div>

<div id="loading" class="container" style="text-align:center;padding:60px">
  <p class="hint">Memuat foto...</p>
</div>

<div id="app" style="display:none">
  <div class="client-header">
    <div style="max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center">
      <div>
        <h2 id="clientName" style="margin:0">Nama Client</h2>
      </div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <div style="min-width:180px">
          <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:600"><span>Terpilih</span><span id="counter">0 / 20</span></div>
          <div class="progress" style="margin-top:6px"><div id="progressBar" style="width:0%"></div></div>
          <div class="hint" id="counterHint" style="font-size:11px;margin-top:4px"></div>
        </div>
        <button class="btn gold small" id="btnSubmit">Simpan Pilihan</button>
      </div>
    </div>
  </div>

  <div class="container" style="padding-top:16px">

    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px">
      <div class="filters" id="filters" style="margin:0">
        <button data-f="all" class="active">Semua</button>
        <button data-f="1">Dipilih</button>
        <button data-f="2">Dipertimbangkan <span id="countConsidered" class="mono"></span></button>
        <button data-f="0">Belum</button>
      </div>
    </div>

    <div id="gallery" class="gallery" style="margin-top:14px"></div>
    <div id="empty" class="hint" style="text-align:center;padding:30px;display:none"></div>
  </div>
</div>

<footer style="margin-top:32px;border-top:1px solid var(--border);padding:20px 24px;background:white">
  <div style="max-width:1100px;margin:0 auto;display:flex;justify-content:center;align-items:center;gap:8px">
    <img src="assets/logo/logo.png" alt="Granads" style="height:24px;width:auto;object-fit:contain"/>
    <span class="hint">© 2026 <a href="https://wa.me/62882001540684" target="_blank" rel="noopener" style="color:var(--granads-primary);font-weight:700;text-decoration:underline;text-underline-offset:2px">Granads</a></span>
  </div>
</footer>

<div id="bulkPopup" class="bulk-popup">
  <span class="count" id="bulkCount">0 foto</span>
  <button class="btn small" style="background:var(--granads-primary);border-color:var(--granads-primary)" onclick="bulk(1)">Pilih</button>
  <button class="btn small" style="background:var(--granads-primary);border-color:var(--granads-primary)" onclick="bulk(2)">Ragu</button>
</div>

<div id="lightbox" class="lightbox" onclick="if(event.target===this) closeLightbox()">
  <button class="lb-nav" id="lbPrev" onclick="event.stopPropagation();prevPhoto()" aria-label="prev">‹</button>
  <img id="lbImg" src="" alt=""/>
  <button class="lb-nav" id="lbNext" onclick="event.stopPropagation();nextPhoto()" aria-label="next">›</button>
  <div class="lb-note" onclick="event.stopPropagation()">
    <input id="lbNote" placeholder="Catatan untuk foto ini... (cth: cerahkan, crop tight)" maxlength="500" oninput="setNote(focusedId, this.value)"/>
  </div>
  <div style="position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
    <button class="btn small" style="background:var(--granads-primary);border-color:var(--granads-primary)" onclick="setFocused(1)">Pilih</button>
    <button class="btn small" id="lbBtn2" style="background:var(--granads-primary);border-color:var(--granads-primary)" onclick="setFocused(2)">Ragu</button>
    <button class="btn small ghost" onclick="closeLightbox()">Tutup</button>
  </div>
  <div style="position:absolute;top:16px;left:50%;transform:translateX(-50%);color:white;background:rgba(0,0,0,.5);padding:6px 12px;border-radius:999px;font-size:12px" id="lbCounter"></div>
  <div style="position:absolute;top:16px;right:16px;color:white" class="hint" id="lbName">  </div>
</div>

<div id="thankYouModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;align-items:center;justify-content:center">
  <div style="background:white;border-radius:20px;padding:28px 28px 20px;max-width:380px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.2);text-align:center">
    <img src="assets/logo/logo.png" alt="Granads" style="height:48px;width:auto;object-fit:contain;margin-bottom:14px"/>
    <p style="margin:0 0 4px;font-size:15px;font-weight:600;color:var(--granads-dark);line-height:1.5">Untuk setiap momen yang layak dikenang.</p>
    <p style="margin:0 0 18px;font-size:15px;font-weight:600;color:var(--granads-primary);line-height:1.5">Terima kasih sudah memilih Granads.</p>
    <div style="display:flex;gap:12px;justify-content:center;margin-bottom:20px">
      <a href="https://instagram.com/granadds" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:999px;border:1px solid var(--border);text-decoration:none;color:var(--granads-dark);font-size:13px;font-weight:600">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="5"/><circle cx="17.5" cy="6.5" r="1.5" fill="currentColor" stroke="none"/></svg>
        Instagram
      </a>
      <a href="https://wa.me/62882001540684" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:999px;border:1px solid var(--border);text-decoration:none;color:var(--granads-dark);font-size:13px;font-weight:600">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        WhatsApp
      </a>
    </div>
    <button class="btn small" onclick="document.getElementById('thankYouModal').style.display='none'" style="width:100%">Tutup</button>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const projectId = params.get('id');
let project = null;
let photos = [];
let selections = {};
let checked = new Set();
let filter = 'all';
let focusedId = null;
let saveTimer = null;
let visibleCount = 100;

if(!projectId){
  document.getElementById('loading').innerHTML = `<div class="card" style="max-width:520px;margin:0 auto;text-align:center"><h3>Link tidak valid</h3><p class="hint">Buka link dari Owner, contoh: <span class="mono">/client?id=abc123</span></p><a href="owner" class="btn">Ke Owner</a></div>`;
} else {
  init();
}

async function init(){
  try{
    const r = await fetch(`/api/projects/${projectId}`);
    if(!r.ok) throw new Error('Project tidak ditemukan');
    const p = await r.json();
    project = p;
    photos = p.photos || [];
    selections = p.selections || {};
    document.getElementById('loading').style.display='none';
    document.getElementById('app').style.display='block';
    document.getElementById('clientName').textContent = p.clientName;
    render();
    setupKeys();
    setupSwipe();
  }catch(e){
    document.getElementById('loading').innerHTML = `<div class="card" style="max-width:520px;margin:0 auto;text-align:center"><h3>Error</h3><p class="hint">${esc(e.message)}</p></div>`;
  }
}

function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function selVal(v){ if(v==null) return 0; if(typeof v==='object') return v.v ?? v.value ?? 0; return Number(v)||0; }
function selNote(v){ if(typeof v==='object') return v.note ?? v.comment ?? ''; return ''; }
function filteredPhotos(){
  return photos.filter(ph=>{
    const v = selVal(selections[ph.id]);
    if(filter==='all') return true;
    return String(v)===String(filter);
  });
}
function currentIndex(){
  const list = filteredPhotos();
  return list.findIndex(p=>p.id===focusedId);
}

function render(){
  updateCounts();
  const list = filteredPhotos();
  const gal = document.getElementById('gallery');
  const empty = document.getElementById('empty');
  if(list.length===0){
    gal.innerHTML='';
    empty.style.display='block';
    empty.textContent = photos.length===0 ? 'Belum ada foto di project ini. Owner perlu upload foto dulu.' : 'Tidak ada foto di filter ini.';
    return;
  }
  empty.style.display='none';
  const visible = list.slice(0, visibleCount);
  const hasMore = list.length > visibleCount;
  gal.innerHTML = visible.map(ph=>{
    const raw = selections[ph.id];
    const v = selVal(raw);
    const note = selNote(raw);
    const cls = v===1?'selected':v===2?'considered':'';
    const dot = v===1?'<span class="status-dot s1">DIPILIH</span>':v===2?'<span class="status-dot s2">RAGU</span>':'';
    const isChecked = checked.has(ph.id);
    const hasNote = (v===1 && note) ? `<span class="note-indicator" title="${esc(note)}">📝 ada catatan</span>` : '';
    const noteInput = v===1 ? `<div class="photo-note-wrap" onclick="event.stopPropagation()"><input type="text" placeholder="Catatan (cerahkan, crop...)" value="${esc(note)}" oninput="setNote('${esc(ph.id)}', this.value)" onfocus="focusedId='${esc(ph.id)}'" maxlength="500"/></div>` : '';
    return `<div class="photo-card ${cls}" data-id="${esc(ph.id)}" onmouseenter="focusedId='${esc(ph.id)}'" onclick="openLightbox('${esc(ph.id)}')">
      <img src="${esc(ph.url)}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x300?text=${encodeURIComponent(ph.filename)}'"/>
      <div class="check ${isChecked?'checked':''}" onclick="event.stopPropagation();toggleCheck('${esc(ph.id)}')">${isChecked?'✓':''}</div>
      ${dot}
      ${hasNote}
      <div class="photo-name" onclick="event.stopPropagation()">${esc(ph.filename)}</div>
      <div class="card-actions" onclick="event.stopPropagation()">
        <button type="button" class="btn-1 ${v===1?'active':''}" onclick="setSelection('${esc(ph.id)}',1)">PILIH</button>
        <button type="button" class="btn-2 ${v===2?'active':''}" onclick="setSelection('${esc(ph.id)}',2)">RAGU</button>
      </div>
      ${noteInput}
    </div>`;
  }).join('');
  if(hasMore){
    gal.innerHTML += `<div style="grid-column:1/-1;text-align:center;padding:16px"><button class="btn ghost small" onclick="visibleCount+=100;render()">See More (${list.length - visibleCount} lainnya)</button></div>`;
  }
}

function updateCounts(){
  const selCount = Object.values(selections).filter(v=>selVal(v)===1).length;
  const considered = Object.values(selections).filter(v=>selVal(v)===2).length;
  const max = project ? project.maxSelection : 20;
  const set = (id, txt)=>{ const el=document.getElementById(id); if(el) el.textContent=txt; };
  set('counter', `${selCount} / ${max}`);
  const bar=document.getElementById('progressBar');
  if(bar){ bar.style.width = Math.min(100, Math.round(selCount/max*100)) + '%'; bar.style.background = selCount>max ? 'var(--bad)' : 'var(--ok)'; }
  set('counterHint', selCount>max ? `Melebihi batas ${selCount-max} foto` : selCount===max ? 'Pas sesuai batas' : `Kurang ${max-selCount} lagi`);
  set('countConsidered', considered ? `(${considered})` : '');
  const n = checked.size;
  const popup = document.getElementById('bulkPopup');
  if(popup){
    if(n>0){ popup.classList.add('show'); set('bulkCount', n+' foto'); }
    else popup.classList.remove('show');
  }
}
function clearChecked(){ checked.clear(); render(); if(document.getElementById('lightbox').classList.contains('open')) updateLightbox(); }

function setSelection(id, val){
  const curVal = selVal(selections[id]);
  const curNote = selNote(selections[id]);
  if(curVal===val){
    delete selections[id]; // toggle off, hapus termasuk note (catatan hanya untuk Dipilih)
  } else {
    if(val===1 && curNote) selections[id] = { v: val, note: curNote };
    else if(val===1) selections[id] = val; // akan isi note nanti via input
    else selections[id] = val; // Ragu (2) tidak simpan note
    // jika pindah dari Dipilih ke Ragu, buang note
    if(val===2 && curNote) selections[id] = 2;
  }
  focusedId = id;
  render();
  if(document.getElementById('lightbox').classList.contains('open')) updateLightbox();
  debouncedSave();
}
function setNote(id, text){
  const curVal = selVal(selections[id]);
  if(curVal!==1) return; // hanya untuk yang Dipilih
  const t = text.trim().slice(0,500);
  if(!t){
    selections[id]=1;
  } else {
    selections[id] = { v: 1, note: t };
  }
  debouncedSave();
}

function toggleCheck(id){
  if(checked.has(id)) checked.delete(id);
  else checked.add(id);
  render();
}

function bulk(val){
  if(checked.size===0) return alert('Centang beberapa foto dulu (klik kotak kiri atas foto)');
  checked.forEach(id=> {
    const note = selNote(selections[id]);
    selections[id] = note ? { v: val, note } : val;
  });
  const n = checked.size;
  checked.clear();
  render();
  if(document.getElementById('lightbox').classList.contains('open')) updateLightbox();
  debouncedSave();
  // toast
  const msg = val===1?n+' foto jadi Dipilih':n+' foto jadi Ragu';
  const t=document.createElement('div'); t.textContent=msg; t.style.cssText='position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--granads-dark);color:white;padding:8px 14px;border-radius:999px;font-size:12px;z-index:60';
  document.body.appendChild(t); setTimeout(()=>t.remove(),1500);
}

function debouncedSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 400);
}

async function save(){
  if(!projectId) return;
  try{
    await fetch(`/api/projects/${projectId}/selections`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({selections})});
    const btn = document.getElementById('btnSubmit');
    const orig = btn.textContent;
    btn.textContent='Tersimpan';
    setTimeout(()=>btn.textContent=orig, 1200);
  }catch(e){ console.error(e)}
}

function setupKeys(){
  document.addEventListener('keydown', (e)=>{
    if(e.target.tagName==='INPUT' || e.target.tagName==='TEXTAREA') return;
    const lbOpen = document.getElementById('lightbox').classList.contains('open');
    if(e.key==='ArrowRight'){
      e.preventDefault();
      if(lbOpen) nextPhoto(); else focusNext(1);
    } else if(e.key==='ArrowLeft'){
      e.preventDefault();
      if(lbOpen) prevPhoto(); else focusNext(-1);
    } else if(e.key==='1' || e.key==='2'){
      if(!focusedId){
        const list = filteredPhotos();
        if(list.length) focusedId = list[0].id;
      }
      if(focusedId) {
        if(filter==='2' && e.key==='2') return;
        setSelection(focusedId, parseInt(e.key));
        // auto next after choose in lightbox for speed
        if(lbOpen && e.key==='1') setTimeout(()=>nextPhoto(), 180);
      }
    } else if(e.key==='Escape'){
      closeLightbox();
    }
  });
}

function focusNext(dir){
  const list = filteredPhotos();
  if(!list.length) return;
  let idx = list.findIndex(p=>p.id===focusedId);
  if(idx===-1) idx=0; else idx = Math.max(0, Math.min(list.length-1, idx+dir));
  focusedId = list[idx].id;
  // highlight scroll
  const el = document.querySelector(`.photo-card[data-id="${focusedId}"]`);
  if(el) el.scrollIntoView({behavior:'smooth', block:'nearest'});
  render();
}

function openLightbox(id){
  const ph = photos.find(p=>p.id===id);
  if(!ph) return;
  focusedId = id;
  updateLightbox();
  document.getElementById('lightbox').classList.add('open');
}
function updateLightbox(){
  const ph = photos.find(p=>p.id===focusedId);
  if(!ph) return;
  const list = filteredPhotos();
  const idx = list.findIndex(p=>p.id===focusedId);
  document.getElementById('lbImg').src = ph.url;
  document.getElementById('lbName').textContent = ph.filename;
  document.getElementById('lbCounter').textContent = `${idx+1} / ${list.length}`;
  const v = selVal(selections[ph.id]);
  const lbNote = document.getElementById('lbNote');
  lbNote.value = v===1 ? selNote(selections[ph.id]) : '';
  lbNote.style.display = v===1 ? '' : 'none';
  lbNote.placeholder = v===1 ? 'Catatan untuk foto Dipilih ini...' : '';
  lbNote.disabled = v!==1;
  // hide Ragu button when in Dipertimbangkan filter per request (optional)
  document.getElementById('lbBtn2').style.display = filter==='2' ? 'none' : '';
  document.getElementById('lbImg').style.outline = v===1?'4px solid var(--ok)':v===2?'4px solid var(--warn)':'none';
}
function closeLightbox(){ document.getElementById('lightbox').classList.remove('open');}
function setFocused(val){
  if(focusedId) {
    setSelection(focusedId, val);
    // auto next for 1 in lightbox
    if(document.getElementById('lightbox').classList.contains('open') && val===1){
      setTimeout(()=>nextPhoto(), 180);
    }
  }
}
function nextPhoto(){
  const list = filteredPhotos();
  let idx = list.findIndex(p=>p.id===focusedId);
  if(idx===-1) return;
  if(idx < list.length-1){ focusedId = list[idx+1].id; updateLightbox(); }
}
function prevPhoto(){
  const list = filteredPhotos();
  let idx = list.findIndex(p=>p.id===focusedId);
  if(idx>0){ focusedId = list[idx-1].id; updateLightbox(); }
}

function setupSwipe(){
  const lb = document.getElementById('lightbox');
  let startX=0, startY=0;
  lb.addEventListener('touchstart', e=>{ startX=e.touches[0].clientX; startY=e.touches[0].clientY; }, {passive:true});
  lb.addEventListener('touchend', e=>{
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40){
      if(dx < 0) nextPhoto(); else prevPhoto();
    }
  }, {passive:true});
  // mouse drag
  let isDown=false, mStartX=0;
  lb.addEventListener('mousedown', e=>{ isDown=true; mStartX=e.clientX; });
  lb.addEventListener('mouseup', e=>{
    if(!isDown) return; isDown=false;
    const dx = e.clientX - mStartX;
    if(Math.abs(dx) > 50){ if(dx < 0) nextPhoto(); else prevPhoto(); }
  });
}

// Filters
document.getElementById('filters').onclick = (e)=>{
  if(e.target.tagName!=='BUTTON') return;
  filter = e.target.dataset.f;
  visibleCount = 100;
  document.querySelectorAll('#filters button').forEach(b=>b.classList.toggle('active', b.dataset.f===filter));
  checked.clear();
  render();
};
document.getElementById('btnSubmit').onclick = async ()=>{
  await save();
  document.getElementById('thankYouModal').style.display = 'flex';
};
</script>
