<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Granads — Shoots</title>
<link rel="icon" href="/assets/logo/favicon.ico" type="image/x-icon"/><link rel="apple-touch-icon" href="/assets/logo/logo.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="topbar">
  <div class="brand" id="logoBrand" style="display:flex;align-items:center;gap:10px;cursor:pointer" title="Auth">
    <img src="assets/logo/logo.png" alt="Granads" style="height:32px;width:auto;object-fit:contain" onerror="this.style.display='none'"/>
  </div>
  <div class="nav">
    <a href="/projects">Projects</a>
    <a href="/schedule">Jadwal</a>
    <a href="/moodboard" class="active">Shoots</a>
    <a href="/porto-admin">Portofolio</a>
    <a href="/owner">Pesanan</a>
  </div>
</div>
<div id="hiddenAuth" style="display:none;max-width:1100px;margin:0 auto;padding:10px 24px;background:#FFFCF8;border-bottom:1px solid var(--border);align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
  <div>
    <b style="font-size:12px">Auth Drive</b>
    <div class="hint" id="authHintHidden" style="font-size:12px"></div>
  </div>
  <div style="display:flex;gap:8px">
    <a href="/auth/login" class="btn gold small" id="btnLoginHidden">Login Google</a>
    <button class="btn ghost small" id="btnLogoutHidden">Logout</button>
  </div>
</div>

<div id="adminGate" style="display:none;max-width:1100px;margin:16px auto 0;padding:0 24px"></div>
<div class="container" id="mainContent" style="display:none;max-width:100%!important;width:100%!important;margin:0!important;padding:24px 40px">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px">
    <h1 style="margin:0">Shoots</h1>
    <button class="btn gold small" onclick="openModal()">+ Tambah Project</button>
  </div>
  <div id="projectList" style="display:flex;flex-direction:column;gap:8px"></div>
</div>

<div id="projectModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;align-items:center;justify-content:center">
  <div style="background:white;border-radius:16px;padding:24px;max-width:440px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.2)">
    <h3 id="projectModalTitle" style="margin:0 0 16px">Tambah Project</h3>
    <div style="display:grid;gap:12px">
      <div>
        <label>Nama Klien / Acara</label>
        <input id="mbName" placeholder="cth: Prewedding Rina & Dimas"/>
      </div>
      <div>
        <label>Lokasi</label>
        <input id="mbLocation" placeholder="cth: Taman Mini Indonesia Indah"/>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div>
          <label>Tanggal</label>
          <input id="mbDate" type="date"/>
        </div>
        <div>
          <label>Jam</label>
          <input id="mbTime" type="time" value="08:00"/>
        </div>
      </div>
      <div>
        <label>Catatan</label>
        <input id="mbNote" placeholder="cth: Bawa 2 set baju"/>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:4px">
        <button class="btn ghost small" onclick="closeModal()">Batal</button>
        <button class="btn small" id="btnSaveProject" onclick="saveProject()">Simpan</button>
      </div>
    </div>
  </div>
</div>

<div id="confirmModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;align-items:center;justify-content:center">
  <div style="background:white;border-radius:16px;padding:24px;max-width:400px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.2)">
    <p id="confirmMsg" style="margin:0 0 20px;font-size:14px;line-height:1.6"></p>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn small ghost" onclick="confirmResolve(false);document.getElementById('confirmModal').style.display='none'">Batal</button>
      <button class="btn small" style="background:#B91C1C;border-color:#B91C1C" onclick="confirmResolve(true);document.getElementById('confirmModal').style.display='none'">Hapus</button>
    </div>
  </div>
</div>

<footer style="margin-top:auto;border-top:1px solid var(--border);padding:20px 24px;background:white">
  <div style="max-width:1100px;margin:0 auto;display:flex;justify-content:center;align-items:center;gap:8px">
    <img src="assets/logo/logo.png" alt="Granads" style="height:24px;width:auto;object-fit:contain"/>
    <span class="hint">© 2026 <a href="https://wa.me/62882001540684" target="_blank" rel="noopener" style="color:var(--granads-primary);font-weight:700;text-decoration:underline;text-underline-offset:2px">Granads</a></span>
  </div>
</footer>

<div id="deliveryModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;align-items:center;justify-content:center">
  <div style="background:white;border-radius:16px;padding:24px;max-width:480px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.2)">
    <h3 style="margin:0 0 6px">Delivery</h3>
    <p class="hint" style="margin:0 0 16px;font-size:12px">Paste link folder Drive yang berisi foto hasil edit. Client bisa download dari sini.</p>
    <div style="display:grid;gap:12px">
      <div>
        <label>Link Folder Drive</label>
        <input id="deliveryLink" placeholder="https://drive.google.com/drive/folders/..."/>
      </div>
      <div id="deliveryResult" style="display:none">
        <label>Link untuk Client</label>
        <div style="display:flex;gap:6px;align-items:center">
          <input id="deliveryUrl" readonly style="flex:1;font-size:12px"/>
          <button class="btn small ghost" onclick="navigator.clipboard.writeText(document.getElementById('deliveryUrl').value);alert('Copied!')">Salin</button>
        </div>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:4px">
        <button class="btn ghost small" onclick="document.getElementById('deliveryModal').style.display='none'">Tutup</button>
        <button class="btn small" onclick="saveDelivery()">Simpan</button>
      </div>
    </div>
  </div>
</div>

<div id="deliveryFullModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;align-items:center;justify-content:center">
  <div style="background:white;border-radius:16px;padding:24px;max-width:480px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.2)">
    <h3 style="margin:0 0 6px">Delivery Full</h3>
    <p class="hint" style="margin:0 0 16px;font-size:12px">Buat link pemilihan foto untuk client.</p>
    <div style="display:grid;gap:12px">
      <div>
        <label>Link Google Drive Folder</label>
        <input id="dfDriveLink" placeholder="https://drive.google.com/drive/folders/..."/>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div>
          <label>Maks Pemilihan Foto</label>
          <input id="dfMaxSelection" type="number" value="20" min="1"/>
        </div>
        <div>
          <label>Deadline</label>
          <input id="dfDeadline" type="date"/>
        </div>
      </div>
      <div id="dfResult" style="display:none">
        <label>Link untuk Client</label>
        <div style="display:flex;gap:6px;align-items:center">
          <input id="dfUrl" readonly style="flex:1;font-size:12px"/>
          <button class="btn small ghost" onclick="navigator.clipboard.writeText(document.getElementById('dfUrl').value);alert('Copied!')">Salin</button>
        </div>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:4px">
        <button class="btn ghost small" onclick="document.getElementById('deliveryFullModal').style.display='none'">Tutup</button>
        <button class="btn small" id="btnCreateFull" onclick="createFullProject()">Buat Link</button>
      </div>
    </div>
  </div>
</div>

<script>
let projects = [];
let schedules = [];
let confirmResolve = null;

function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
async function api(path, opts={}){
  const r = await fetch(path, opts);
  const j = await r.json().catch(()=>({}));
  if(!r.ok){
    if(r.status===401) throw new Error(j.error||'Belum login Google');
    if(r.status===403) throw new Error(j.error||'Akses ditolak');
    throw new Error(j.error||j.message||'Error');
  }
  return j;
}

async function init(){
  try{
    [projects, schedules] = await Promise.all([api('/api/shoots'), api('/api/schedules')]);
    renderList();
  }catch(e){
    const el=document.getElementById('projectList');
    if(el) el.innerHTML = `<div class="card" style="text-align:center;padding:32px"><h3>Perlu Login</h3><p class="hint">${esc(e.message)}</p><a href="/auth/login" class="btn gold">Login dengan Google</a></div>`;
  }
}

let authState=null;
async function checkAuth(){
  try{
    const s = await fetch('/auth/status').then(r=>r.json());
    authState=s;
    const hint = document.getElementById('authHintHidden');
    const btnLogin = document.getElementById('btnLoginHidden');
    if(hint){
      if(s.isAdmin) hint.textContent = `Login sebagai ${s.email} — akses owner aktif`;
      else if(s.loggedIn) hint.textContent = `Login sebagai ${s.email} — bukan admin (${s.allowed.join(', ')})`;
      else if(s.configured) hint.textContent = 'Belum login — klik Login Google (hanya nadhasantika63@gmail.com / granadds@gmail.com)';
      else hint.textContent = 'OAuth belum dikonfigurasi';
      if(btnLogin) btnLogin.textContent = s.loggedIn ? 'Ganti Akun' : 'Login Google';
    }
    const gate=document.getElementById('adminGate');
    const main=document.getElementById('mainContent');
    if(gate){
      if(!s.isAdmin){
        gate.style.display='block';
        gate.innerHTML=s.loggedIn?`<div class="card" style="text-align:center;padding:32px"><h3>Akses Ditolak</h3><p class="hint">Login sebagai <b>${esc(s.email)}</b> tidak diizinkan.</p></div>`:`<div class="card" style="text-align:center;padding:32px"><h3>Login Diperlukan</h3><p class="hint">Halaman ini hanya untuk admin</p><a href="/auth/login" class="btn gold">Login dengan Google</a></div>`;
        if(main) main.style.display='none';
      } else { gate.style.display='none'; if(main) main.style.display='block'; }
    } else if(main) main.style.display = s.isAdmin ? 'block' : 'none';
    return s;
  }catch{}
}
checkAuth().then(s=>{ if(s?.isAdmin) init(); else {
  const el=document.getElementById('projectList');
  if(el) el.innerHTML=`<div class="hint" style="text-align:center;padding:16px">Login dulu.</div>`;
}});
document.getElementById('logoBrand').addEventListener('click', ()=>{
  const p=document.getElementById('hiddenAuth');
  p.style.display = p.style.display==='none' ? 'flex' : 'none';
});
document.getElementById('btnLogoutHidden') && (document.getElementById('btnLogoutHidden').onclick = async ()=>{ await fetch('/auth/logout',{method:'POST'}); checkAuth(); alert('Logout berhasil'); location.reload(); });

function showConfirm(msg){
  return new Promise(resolve=>{
    confirmResolve = resolve;
    document.getElementById('confirmMsg').textContent = msg;
    document.getElementById('confirmModal').style.display = 'flex';
  });
}

function save(){ /* no-op: data saved via API */ }

function renderList(){
  const all = [...projects];
  const el = document.getElementById('projectList');
  if(all.length===0){
    el.innerHTML = `<div class="hint" style="text-align:center;padding:40px">Belum ada project. Klik "+ Tambah Project" untuk mulai.</div>`;
    return;
  }
  const months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  el.innerHTML = all.sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')).map(p=>{
    const d = p.date ? new Date(p.date+'T'+(p.time||'00:00')) : null;
    const dateStr = d ? `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}` : '-';
    const timeStr = p.time || '';
    return `<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:18px 24px">
      <div style="flex:1;min-width:200px">
        <div style="font-weight:700;font-size:15px">${esc(p.name)}</div>
        <div class="hint" style="font-size:12px">${esc(dateStr)}${timeStr?' \u2022 '+esc(timeStr):''}${p.location?' \u2022 '+esc(p.location):''}</div>
        ${p.note?`<div class="hint" style="font-size:11px;margin-top:2px">${esc(p.note)}</div>`:''}
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <a href="moodboard-work?id=${esc(p.id)}" class="btn small ghost" style="text-decoration:none">Moodboard</a>
        <button class="btn small ghost" onclick="openDeliveryFull('${esc(p.id)}')">Delivery Full</button>
        ${p.deliveryProjectId ? `<button class="btn small ghost" onclick="fetchShootDrive('${esc(p.id)}','${esc(p.deliveryProjectId)}')">Fetch</button>` : ''}
        <button class="btn small ghost" onclick="openDelivery('${esc(p.id)}')">Delivery Edited</button>
        <button class="btn small ghost" onclick="editProject('${esc(p.id)}')">Edit</button>
        <button class="btn small ghost" style="border-color:#FECACA;color:#B91C1C" onclick="deleteProject('${esc(p.id)}')">Hapus</button>
      </div>
    </div>`;
  }).join('');
}

let editingId = null;

function openModal(dateStr){
  editingId = null;
  document.getElementById('projectModalTitle').textContent = 'Tambah Project';
  document.getElementById('mbName').value='';
  document.getElementById('mbLocation').value='';
  document.getElementById('mbDate').value=dateStr||'';
  document.getElementById('mbTime').value='08:00';
  document.getElementById('mbNote').value='';
  document.getElementById('projectModal').style.display='flex';
}
function closeModal(){ document.getElementById('projectModal').style.display='none'; }

async function saveProject(){
  const name = document.getElementById('mbName').value.trim();
  const location = document.getElementById('mbLocation').value.trim();
  const date = document.getElementById('mbDate').value;
  const time = document.getElementById('mbTime').value;
  const note = document.getElementById('mbNote').value.trim();
  if(!name) return alert('Nama wajib diisi');
  if(!date) return alert('Tanggal wajib diisi');

  if(editingId){
    const p = projects.find(x=>x.id===editingId);
    if(p){ p.name=name; p.location=location; p.date=date; p.time=time; p.note=note; }
    await api(`/api/shoots/${editingId}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(p)});
    if(p?.scheduleId){
      await api(`/api/schedules/${p.scheduleId}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name, location, date, time, note, projectId:editingId})});
    }
  } else {
    const id = Date.now().toString(36);
    const shoot = { id, name, date, time, location, note, items: [], deliveryLink: null, deliveryFolderId: null, createdAt: new Date().toISOString() };
    const saved = await api('/api/shoots', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(shoot)});
    shoot.id = saved.id;
    projects.push(shoot);
    const sched = { name, location, date, time, note, projectId: saved.id };
    const savedSched = await api('/api/schedules', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(sched)});
    sched.id = savedSched.id;
    schedules.push(sched);
    shoot.scheduleId = savedSched.id;
    await api(`/api/shoots/${saved.id}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({scheduleId:savedSched.id})});
  }
  renderList();
  closeModal();
}

async function deleteProject(id){
  const ok = await showConfirm('Hapus project ini?');
  if(!ok) return;
  projects = projects.filter(x=>x.id!==id);
  await api(`/api/shoots/${id}`, {method:'DELETE'});
  const sched = schedules.find(s=>s.projectId===id);
  if(sched){
    schedules = schedules.filter(s=>s.projectId!==id);
    await api(`/api/schedules/${sched.id}`, {method:'DELETE'});
  }
  renderList();
}

function editProject(id){
  const p = projects.find(x=>x.id===id);
  if(!p) return;
  editingId = id;
  document.getElementById('projectModalTitle').textContent = 'Edit Project';
  document.getElementById('mbName').value=p.name;
  document.getElementById('mbLocation').value=p.location||'';
  document.getElementById('mbDate').value=p.date||'';
  document.getElementById('mbTime').value=p.time||'08:00';
  document.getElementById('mbNote').value=p.note||'';
  document.getElementById('projectModal').style.display='flex';
}

let deliveryProjectId = null;

let deliveryFullProjectId = null;

function openDeliveryFull(id){
  deliveryFullProjectId = id;
  const p = projects.find(x=>x.id===id);
  document.getElementById('dfDriveLink').value = '';
  document.getElementById('dfMaxSelection').value = '20';
  document.getElementById('dfDeadline').value = p?.date || '';
  document.getElementById('dfResult').style.display='none';
  document.getElementById('btnCreateFull').disabled=false;
  document.getElementById('btnCreateFull').textContent='Buat Link';
  document.getElementById('deliveryFullModal').style.display='flex';
}

async function createFullProject(){
  const p = projects.find(x=>x.id===deliveryFullProjectId);
  if(!p) return;
  const driveLink = document.getElementById('dfDriveLink').value.trim();
  const maxSelection = document.getElementById('dfMaxSelection').value;
  const deadline = document.getElementById('dfDeadline').value;
  if(!driveLink) return alert('Link Drive wajib diisi');
  const btn = document.getElementById('btnCreateFull');
  btn.disabled=true; btn.textContent='Membuat...';
  try{
    const r = await fetch('/api/projects', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({clientName: p.name, driveLink, maxSelection, deadline})});
    const j = await r.json();
    if(!r.ok) throw new Error(j.error);
    p.deliveryProjectId = j.project.id;
    await api(`/api/shoots/${deliveryFullProjectId}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({deliveryProjectId: j.project.id})});
    document.getElementById('dfResult').style.display='block';
    document.getElementById('dfUrl').value = j.fullClientLink;
    renderList();
  }catch(e){ alert(e.message) }
  finally{ btn.disabled=false; btn.textContent='Buat Link' }
}

function openDelivery(id){
  deliveryProjectId = id;
  const p = projects.find(x=>x.id===id);
  document.getElementById('deliveryLink').value = p?.deliveryLink || '';
  if(p?.deliveryFolderId){
    document.getElementById('deliveryResult').style.display='block';
    document.getElementById('deliveryUrl').value = `${location.origin}/download?folder=${p.deliveryFolderId}`;
  } else {
    document.getElementById('deliveryResult').style.display='none';
  }
  document.getElementById('deliveryModal').style.display='flex';
}

function extractDriveFolderId(link){
  if(!link) return null;
  const m1 = link.match(/\/folders\/([a-zA-Z0-9-_]+)/);
  if(m1) return m1[1];
  const m2 = link.match(/[?&]id=([a-zA-Z0-9-_]+)/);
  if(m2) return m2[1];
  if(/^[a-zA-Z0-9-_]{20,}$/.test(link.trim())) return link.trim();
  return null;
}

async function saveDelivery(){
  const link = document.getElementById('deliveryLink').value.trim();
  const folderId = extractDriveFolderId(link);
  if(!folderId) return alert('Link tidak valid. Paste link folder Drive.');
  const p = projects.find(x=>x.id===deliveryProjectId);
  if(!p) return;
  p.deliveryLink = link;
  p.deliveryFolderId = folderId;
  await api(`/api/shoots/${deliveryProjectId}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({deliveryLink:link, deliveryFolderId:folderId})});
  document.getElementById('deliveryResult').style.display='block';
  document.getElementById('deliveryUrl').value = `${location.origin}/download?folder=${folderId}`;
  renderList();
}

async function fetchShootDrive(shootId, projectId){
  const p = projects.find(x=>x.id===shootId);
  let link = p?.deliveryLink || p?.driveLink;
  if(!link) link = prompt('Paste link Drive folder:');
  if(!link) return;
  try{
    const res = await api(`/api/projects/${projectId}/fetch-drive`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({driveLink:link})});
    if(res.ok) alert(`Fetch berhasil (${res.via}): ${res.count} foto`);
    else alert(res.message);
  }catch(e){ alert(e.message) }
}

function copyDeliveryLink(id){
  const p = projects.find(x=>x.id===id);
  const url = p?.deliveryFolderId ? `${location.origin}/download?folder=${p.deliveryFolderId}` : `${location.origin}/download?id=${id}`;
  navigator.clipboard.writeText(url);
  alert('Link delivery disalin!');
}
</script>
</body>
</html>
