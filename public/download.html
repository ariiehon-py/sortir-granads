<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Granads — Download Foto</title>
<link rel="icon" href="/assets/logo/favicon.ico" type="image/x-icon"/><link rel="apple-touch-icon" href="/assets/logo/logo.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
<style>
  .dl-hero{max-width:520px;margin:32px auto 0;text-align:center;padding:0 16px}
  .dl-hero h1{margin:0 0 6px;font-size:22px;font-weight:700}
  .dl-hero .sub{margin:0 0 24px;font-size:13px;color:var(--muted)}
  .dl-card{background:white;border:1px solid var(--border);border-radius:16px;padding:36px 28px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.04)}
  .dl-card h2{margin:0 0 6px;font-size:17px;font-weight:600}
  .dl-card p{margin:0 0 20px;font-size:13px;color:var(--muted)}
  .dl-gallery{width:100%;margin:48px auto 0;padding:20px 0 60px;position:relative;min-height:600px;overflow:hidden}
  .dl-photo{position:absolute;border-radius:12px;overflow:hidden;box-shadow:0 6px 30px rgba(0,0,0,.12);transition:transform .4s ease,box-shadow .3s;cursor:default}
  .dl-photo:hover{transform:scale(1.06)!important;z-index:10;box-shadow:0 12px 40px rgba(0,0,0,.2)}
  .dl-photo img{width:100%;height:100%;object-fit:cover;display:block;background:#E8E0D6}
  .dl-section-title{text-align:center;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 24px}
  .music-toggle{position:fixed;bottom:24px;right:24px;z-index:50;width:48px;height:48px;border-radius:50%;border:1px solid var(--border);background:white;box-shadow:0 4px 16px rgba(0,0,0,.1);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
  .music-toggle:hover{background:var(--granads-primary);color:white;border-color:var(--granads-primary)}
  .music-toggle svg{width:20px;height:20px}
  @media(max-width:768px){
    .dl-hero{margin:24px auto 0}
    .dl-card{padding:24px 20px}
    .dl-gallery{min-height:auto;margin:32px auto 0}
  }
  @media(max-width:600px){
    .dl-photo{position:relative!important;width:88%!important;left:6%!important;height:auto!important;transform:none!important;margin-bottom:16px}
    .dl-photo img{height:220px}
    .dl-gallery{min-height:auto;padding:16px 0}
    .dl-card{padding:20px 16px}
    .music-toggle{bottom:16px;right:16px;width:44px;height:44px}
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand" style="display:flex;align-items:center;gap:10px">
    <img src="assets/logo/logo.png" alt="Granads" style="height:32px;width:auto;object-fit:contain" onerror="this.style.display='none'"/>
  </div>
</div>

<div id="loading" class="container" style="text-align:center;padding:60px">
  <p class="hint">Memuat...</p>
</div>

<div id="app" style="display:none">
  <div class="dl-hero">
    <h1 id="projectName"></h1>
    <p id="projectInfo" class="sub"></p>
    <div class="dl-card">
      <h2>Momen-momen indah telah tertangkap.</h2>
      <p>Saatnya menyimpannya dalam memori. Klik tombol di bawah untuk mengunduh seluruh foto dari Google Drive.</p>

      <div id="testiBox" style="border-top:1px solid var(--border);padding-top:18px;margin-top:4px;text-align:left">
        <p style="margin:0 0 10px;font-size:13px;font-weight:600;color:var(--granads-dark);text-align:center">Beri Testimoni</p>
        <input id="testiName" placeholder="Nama kamu" maxlength="60" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:10px;font-size:13px;margin-bottom:8px;box-sizing:border-box"/>
        <textarea id="testiText" placeholder="Ceritakan pengalaman kamu dengan Granads..." rows="2" maxlength="800" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:10px;font-size:13px;resize:none;font-family:inherit;margin-bottom:8px;box-sizing:border-box"></textarea>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;justify-content:center">
          <div id="testiStars" style="display:flex;gap:2px;font-size:22px;cursor:pointer">
            <span data-s="1" style="color:#C9A86A">&#9733;</span><span data-s="2" style="color:#C9A86A">&#9733;</span><span data-s="3" style="color:#C9A86A">&#9733;</span><span data-s="4" style="color:#C9A86A">&#9733;</span><span data-s="5" style="color:#C9A86A">&#9733;</span>
          </div>
          <span id="testiHint" style="font-size:11px;color:var(--muted)">5 bintang</span>
        </div>
        <button class="btn gold small" id="btnSubmitTesti" onclick="submitTesti()" style="width:100%">Kirim Testimoni</button>
        <div id="testiMsg" style="font-size:12px;text-align:center;margin-top:8px;display:none"></div>
      </div>

      <a id="downloadBtn" href="#" target="_blank" class="btn gold" style="text-decoration:none;display:inline-flex;align-items:center;gap:8px;padding:14px 28px;font-size:15px;margin-top:16px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Download dari Google Drive
      </a>
    </div>
  </div>

  <div id="gallerySection" class="dl-gallery" style="display:none">
    <p class="dl-section-title">Sekilas Preview</p>
    <div id="gallery" style="position:relative;width:100%;height:100%"></div>
  </div>
</div>

<audio id="bgMusic" loop preload="auto">
  <source src="assets/music.mp3" type="audio/mpeg"/>
</audio>
<button class="music-toggle" id="musicBtn" title="Putar / Jeda Musik" onclick="toggleMusic()">
  <svg id="iconPlay" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
  </svg>
  <svg id="iconPause" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
    <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
  </svg>
</button>

<footer style="margin-top:auto;border-top:1px solid var(--border);padding:20px 24px;background:white">
  <div style="max-width:1100px;margin:0 auto;display:flex;justify-content:center;align-items:center;gap:8px">
    <img src="assets/logo/logo.png" alt="Granads" style="height:24px;width:auto;object-fit:contain"/>
    <span class="hint">&copy; 2026 <a href="https://wa.me/62882001540684" target="_blank" rel="noopener" style="color:var(--granads-primary);font-weight:700;text-decoration:underline;text-underline-offset:2px">Granads</a></span>
  </div>
</footer>

<script>
const params = new URLSearchParams(location.search);
const projectId = params.get('id');
const directFolderId = params.get('folder');

async function init(){
  try {
    let project = null;

    if(directFolderId){
      project = { name:'Photo Delivery', date:null, location:null, deliveryFolderId:directFolderId };
    } else {
      const [shoots, projects] = await Promise.all([
        fetch('/api/shoots').then(r=>r.json()).catch(()=>[]),
        fetch('/api/projects').then(r=>r.json()).catch(()=>[])
      ]);

      project = shoots.find(p=>p.id===projectId);

      if(!project){
        const p = projects.find(x=>x.id===projectId);
        if(p && p.driveFolders && p.driveFolders.selected){
          project = { name:p.clientName, date:null, location:null, deliveryFolderId:p.driveFolders.selected };
        }
      }
    }

    if(!project || !project.deliveryFolderId){
      document.getElementById('loading').innerHTML = '<div class="card" style="max-width:500px;margin:0 auto;text-align:center;padding:40px"><h3>Link tidak valid</h3><p class="hint">Project tidak ditemukan atau belum ada foto yang diupload.</p></div>';
      return;
    }
    document.getElementById('loading').style.display='none';
    document.getElementById('app').style.display='block';
    document.getElementById('projectName').textContent = project.name;
    const d = project.date ? new Date(project.date) : null;
    const months = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    const dateStr = d ? d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear() : '';
    document.getElementById('projectInfo').textContent = [dateStr, project.location].filter(Boolean).join(' \u2022 ');
    document.getElementById('downloadBtn').href = 'https://drive.google.com/drive/folders/'+project.deliveryFolderId;
    if(project.drivePhotos && project.drivePhotos.length > 0){
      renderGallery(project.drivePhotos);
    } else {
      fetchPhotos(project.deliveryFolderId);
    }
    // cek sudah testi?
    if(projectId){
      fetch('/api/projects/'+projectId+'/testimonial').then(r=>r.json()).then(d=>{
        if(d.submitted){
          document.getElementById('testiBox').style.display='none';
        }
      }).catch(()=>{});
    }
  } catch(e){
    document.getElementById('loading').innerHTML = '<div class="card" style="max-width:500px;margin:0 auto;text-align:center;padding:40px"><h3>Link tidak valid</h3><p class="hint">Gagal memuat data.</p></div>';
  }
}
init();

function fetchPhotos(folderId){
  fetch('/api/folder/'+folderId+'/photos')
    .then(r=>r.json())
    .then(data=>{
      if(data.photos && data.photos.length > 0) renderGallery(data.photos);
    })
    .catch(()=>{});
}

function renderGallery(photos){
  if(!photos.length) return;
  const section = document.getElementById('gallerySection');
  const gallery = document.getElementById('gallery');
  section.style.display='block';

  const isMobile = window.innerWidth <= 600;
  const picks = photos.slice(0, 18);

  if(isMobile){
    picks.forEach((p,i)=>{
      const div = document.createElement('div');
      div.className = 'dl-photo';
      div.style.cssText = 'position:relative;width:85%;left:7.5%;margin-bottom:16px';
      div.innerHTML = '<img src="'+esc(p.url)+'" alt="'+esc(p.name)+'" loading="lazy"/>';
      gallery.appendChild(div);
    });
    section.style.minHeight = 'auto';
  } else {
    const W = gallery.offsetWidth || 1100;
    const rows = Math.ceil(picks.length / 4);
    const rowH = 280;
    const totalH = rows * rowH + 80;
    gallery.style.height = totalH + 'px';
    section.style.minHeight = (totalH + 80) + 'px';

    const rotations = [-4, 3, -2, 3.5, -3, 2, -1.5, 4, -2.5, 1.5];
    const sizes = [280, 300, 260, 290, 270, 310, 275, 295, 265, 305];

    picks.forEach((p,i)=>{
      const row = Math.floor(i / 4);
      const col = i % 4;
      const perRow = Math.min(4, picks.length - row * 4);
      const gapX = W / (perRow + 1);
      const x = gapX * (col + 1) - sizes[i % sizes.length] / 2 + (Math.random() - 0.5) * 50;
      const y = row * rowH + (Math.random() - 0.5) * 40 + 10;
      const rot = rotations[i % rotations.length] + (Math.random() - 0.5) * 1.5;
      const sz = sizes[i % sizes.length];

      const div = document.createElement('div');
      div.className = 'dl-photo';
      div.style.cssText = 'left:'+x+'px;top:'+y+'px;width:'+sz+'px;height:'+(sz*0.75)+'px;transform:rotate('+rot+'deg)';
      div.innerHTML = '<img src="'+esc(p.url)+'" alt="'+esc(p.name)+'" loading="lazy"/>';
      gallery.appendChild(div);
    });
  }
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

let selectedStars = 5;
document.getElementById('testiStars').onclick = (e)=>{
  const s = e.target.closest('[data-s]');
  if(!s) return;
  selectedStars = parseInt(s.dataset.s);
  document.querySelectorAll('#testiStars span').forEach((el,i)=>{
    el.style.color = i < selectedStars ? '#C9A86A' : '#D1D5DB';
  });
  document.getElementById('testiHint').textContent = selectedStars + ' bintang';
};

async function submitTesti(){
  const name = document.getElementById('testiName').value.trim();
  const text = document.getElementById('testiText').value.trim();
  const msgEl = document.getElementById('testiMsg');
  if(!text){ msgEl.textContent='Tulis testimoni dulu'; msgEl.style.display='block'; msgEl.style.color='#B91C1C'; return; }
  if(!projectId){ msgEl.textContent='Link tidak valid'; msgEl.style.display='block'; msgEl.style.color='#B91C1C'; return; }
  const btn = document.getElementById('btnSubmitTesti');
  btn.disabled=true; btn.textContent='Mengirim...';
  try{
    const r = await fetch('/api/client-testimonial', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ projectId, name: name||'Klien', text, stars: selectedStars })
    });
    const d = await r.json();
    if(!r.ok) throw new Error(d.error||'Gagal');
    msgEl.textContent='Terima kasih! Testimoni kamu sudah dikirim.';
    msgEl.style.color='#16A34A'; msgEl.style.display='block';
    document.getElementById('testiBox').style.opacity='0.5';
    document.getElementById('btnSubmitTesti').disabled=true;
    document.getElementById('btnSubmitTesti').textContent='Terkirim';
    document.getElementById('testiText').value='';
  }catch(e){
    msgEl.textContent=e.message; msgEl.style.color='#B91C1C'; msgEl.style.display='block';
  }finally{ btn.disabled=false; btn.textContent='Kirim Testimoni' }
}

let musicPlaying = false;
const audio = document.getElementById('bgMusic');
function toggleMusic(){
  if(musicPlaying){ audio.pause(); } else { audio.play().catch(()=>{}); }
  musicPlaying = !musicPlaying;
  document.getElementById('iconPlay').style.display = musicPlaying ? 'none' : 'block';
  document.getElementById('iconPause').style.display = musicPlaying ? 'block' : 'none';
}
</script>
</body>
</html>
