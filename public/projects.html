<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Granads — Projects</title>
<link rel="icon" href="/assets/logo/logo.png" type="image/png"/><link rel="apple-touch-icon" href="/assets/logo/logo.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="topbar">
  <div class="brand" id="logoBrand" style="display:flex;align-items:center;gap:10px;cursor:pointer" title="Auth">
    <img src="assets/logo/logo.png" alt="Granads" style="height:32px;width:auto;object-fit:contain" onerror="this.style.display='none'"/>
  </div>
  <div class="nav">
    <a href="/projects" class="active">Projects</a>
    <a href="/schedule">Jadwal</a>
    <a href="/moodboard">Shoots</a>
    <a href="/porto-admin">Portofolio</a>
    <a href="/owner">Pesanan</a>
  </div>
</div>
<div id="hiddenAuth" style="display:none;max-width:1100px;margin:0 auto;padding:10px 24px;background:#FFFCF8;border-bottom:1px solid var(--border);align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
  <div>
    <b style="font-size:12px">Auth Drive</b>
    <div class="hint" id="authHintHidden" style="font-size:12px"></div>
  </div>
  <div style="display:flex;gap:8px">
    <a href="/auth/login" class="btn gold small" id="btnLoginHidden">Login Google</a>
    <button class="btn ghost small" id="btnLogoutHidden">Logout</button>
  </div>
</div>
<div class="container">
  <div id="adminGate" style="display:none;margin-bottom:16px"></div>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px">
    <h1 style="margin:0">Projects</h1>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn ghost small" id="btnRefresh">Refresh</button>
      <span class="hint" id="authMini"></span>
    </div>
  </div>

  <div class="card">
    <div style="overflow:auto">
      <table class="table" id="projectsTable">
        <thead>
          <tr>
            <th>Client</th>
            <th>Link</th>
            <th>Info</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="projectsBody">
          <tr><td colspan="4" class="hint" style="text-align:center;padding:20px">Memuat...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div id="detailSection" class="card" style="margin-top:18px;display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <h3 id="detailTitle" style="margin:0">Detail</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn gold small" id="btnCreateFolders">Bikin Folder di Drive</button>
        <button class="btn ghost small" onclick="document.getElementById('detailSection').style.display='none'">Tutup</button>
      </div>
    </div>
    <div class="hint" id="folderLinks" style="margin-top:8px"></div>
    <div class="filters" id="detailFilters">
      <button data-f="all" class="active">Semua</button>
      <button data-f="1">Terpilih</button>
      <button data-f="2">Dipertimbangkan</button>
      <button data-f="0">Belum pilih</button>
    </div>
    <div id="selectedFiles" style="margin-bottom:12px;display:none">
      <div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px">NAMA FILE YANG DIPILIH:</div>
      <div id="selectedFilesList" style="font-family:monospace;font-size:11px;background:#F9FAFB;border:1px solid var(--border);border-radius:8px;padding:10px;max-height:200px;overflow-y:auto;white-space:pre-wrap;line-height:1.6"></div>
    </div>
    <div id="detailGallery" class="gallery"></div>
    <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <span class="hint" id="detailHint"></span>
      <button class="btn small ghost" id="btnDownloadJson" style="margin-left:auto">Download JSON</button>
    </div>
  </div>
</div>

<div id="confirmModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center">
  <div style="background:white;border-radius:16px;padding:24px;max-width:400px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.2)">
    <p id="confirmMsg" style="margin:0 0 20px;font-size:14px;line-height:1.6"></p>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn small ghost" onclick="confirmResolve(false);document.getElementById('confirmModal').style.display='none'">Batal</button>
      <button class="btn small" style="background:#B91C1C;border-color:#B91C1C" onclick="confirmResolve(true);document.getElementById('confirmModal').style.display='none'">Hapus</button>
    </div>
  </div>
</div>

<div id="editLinkModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center">
  <div style="background:white;border-radius:16px;padding:24px;max-width:480px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.2)">
    <h3 style="margin:0 0 12px">Edit Link Google Drive</h3>
    <div style="display:grid;gap:12px">
      <div>
        <label>Link Google Drive Folder</label>
        <input id="editDriveLinkInput" placeholder="https://drive.google.com/drive/folders/..."/>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:4px">
        <button class="btn ghost small" onclick="document.getElementById('editLinkModal').style.display='none'">Batal</button>
        <button class="btn small" id="btnSaveDriveLink" onclick="saveDriveLink()">Simpan</button>
      </div>
    </div>
  </div>
</div>

<footer style="margin-top:auto;border-top:1px solid var(--border);padding:20px 24px;background:white">
  <div style="max-width:1100px;margin:0 auto;display:flex;justify-content:center;align-items:center;gap:8px">
    <img src="assets/logo/logo.png" alt="Granads" style="height:24px;width:auto;object-fit:contain"/>
    <span class="hint">© 2026 <a href="https://wa.me/62882001540684" target="_blank" rel="noopener" style="color:var(--granads-primary);font-weight:700;text-decoration:underline;text-underline-offset:2px">Granads</a></span>
  </div>
</footer>

<script>
let projects = [];
let detailProject = null;
let detailFilter = 'all';
let detailVisibleCount = 100;
let confirmResolve = null;
function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function selVal(v){ if(v==null) return 0; if(typeof v==='object') return v.v ?? v.value ?? 0; return Number(v)||0; }
function selNote(v){ if(typeof v==='object') return v.note ?? v.comment ?? ''; return ''; }

function showConfirm(msg){
  return new Promise(resolve=>{
    confirmResolve = resolve;
    document.getElementById('confirmMsg').textContent = msg;
    document.getElementById('confirmModal').style.display = 'flex';
  });
}

async function api(path, opts={}){
  const r = await fetch(path, opts);
  const j = await r.json().catch(()=>({}));
  if(!r.ok){
    if(r.status===401) throw new Error(j.error||'Belum login Google — klik logo Granads lalu Login Google');
    if(r.status===403) throw new Error(j.error||'Akses ditolak');
    throw new Error(j.error||j.message||'Error');
  }
  return j;
}

let authState = null;
async function checkAuth(){
  try{
    const s = await fetch('/auth/status').then(r=>r.json());
    authState = s;
    const el = document.getElementById('authMini');
    if(el){
      if(s.isAdmin) el.textContent = `${s.email} ✓`;
      else if(s.loggedIn) el.textContent = `${s.email} (bukan admin)`;
      else el.textContent = '';
    }
    const hint = document.getElementById('authHintHidden');
    const btnLogin = document.getElementById('btnLoginHidden');
    if(hint){
      if(s.isAdmin) hint.textContent = `Login sebagai ${s.email} — akses owner aktif`;
      else if(s.loggedIn) hint.textContent = `Login sebagai ${s.email} — bukan admin (${s.allowed.join(', ')})`;
      else if(s.configured) hint.textContent = 'Belum login — klik Login Google (hanya nadhasantika63@gmail.com / granadds@gmail.com)';
      else hint.textContent = 'OAuth belum dikonfigurasi';
      if(btnLogin) btnLogin.textContent = s.loggedIn ? 'Ganti Akun' : 'Login Google';
    }
    const gate = document.getElementById('adminGate');
    if(gate){
      if(!s.isAdmin){
        gate.style.display='block';
        gate.innerHTML = s.loggedIn
          ? `<div class="card" style="text-align:center;padding:32px"><h3>Akses Ditolak</h3><p class="hint">Login sebagai <b>${esc(s.email)}</b> tidak diizinkan.<br>Hanya <b>${esc(s.allowed.join(', '))}</b> yang boleh.</p><div style="display:flex;gap:8px;justify-content:center;margin-top:12px"><a href="/auth/login" class="btn gold small">Ganti Akun</a><button class="btn ghost small" onclick="fetch('/auth/logout',{method:'POST'}).then(()=>location.reload())">Logout</button></div></div>`
          : `<div class="card" style="text-align:center;padding:32px"><h3>Login Diperlukan</h3><p class="hint">Halaman owner hanya untuk <b>${esc(s.allowed.join(', '))}</b></p><a href="/auth/login" class="btn gold">Login dengan Google</a></div>`;
      } else {
        gate.style.display='none';
      }
    }
    return s;
  }catch{}
}
document.getElementById('logoBrand').addEventListener('click', ()=>{
  const p=document.getElementById('hiddenAuth');
  p.style.display = p.style.display==='none' ? 'flex' : 'none';
});

async function loadProjects(){
  const data = await api('/api/projects');
  projects = data;
  const tbody = document.getElementById('projectsBody');
  if(data.length===0){
    tbody.innerHTML = `<tr><td colspan="4" class="hint" style="text-align:center;padding:24px">Belum ada project.</td></tr>`;
    return;
  }
  tbody.innerHTML = data.map(p=>{
    const link = `${location.origin}/client?id=${p.id}`;
    const c = p.counts;
    const totalChosen = c.selected + c.considered;
    const canMakeFolder = totalChosen>0;
    return `<tr>
      <td data-label="Client"><b>${esc(p.clientName)}</b><br><span class="mono" style="font-size:11px;color:#888">${esc(p.id)} • ${esc(new Date(p.createdAt).toLocaleDateString('id-ID'))}</span></td>
      <td data-label="Link">
        <a href="${esc(link)}" target="_blank" class="mono" style="font-size:11px;color:var(--granads-primary)">${esc(link)}</a>
        ${p.driveFolders ? `<div class="hint" style="font-size:11px"><a href="https://drive.google.com/drive/folders/${esc(p.driveFolders.selected)}" target="_blank">Terpilih</a> • <a href="https://drive.google.com/drive/folders/${esc(p.driveFolders.considered)}" target="_blank">Ragu</a></div>` : ''}
      </td>
      <td data-label="Info">
        <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
          <span class="badge ok">${c.selected} dipilih</span>
          <span class="badge warn">${c.considered} ragu</span>
          ${c.notes?`<span class="badge" style="background:#FFF7ED;border-color:#FDBA74;color:#9A3412">📝 ${c.notes} catatan</span>`:''}
        </div>
      </td>
      <td data-label="Aksi">
        <div style="display:flex;gap:4px;flex-wrap:wrap">
          <button class="btn small ghost" id="btnDetail_${p.id}" onclick="openDetail('${p.id}')">Hasil</button>
          <button class="btn small ghost" onclick="editDriveLink('${p.id}')">Edit Link</button>
          <button class="btn small ghost" ${canMakeFolder?'':'disabled title="Client belum memilih"'} onclick="quickCreateFolders('${p.id}')">Folder</button>
          <button class="btn small ghost" onclick="fetchDrive('${p.id}')">Fetch</button>
          <button class="btn small ghost" style="border-color:#FECACA;color:#B91C1C" onclick="deleteProject('${p.id}')">Hapus</button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

async function fetchDrive(id){
  const p = projects.find(x=>x.id===id);
  let link = p.driveLink;
  if(!link) link = prompt('Paste link Drive folder:');
  if(!link) return;
  try{
    const res = await api(`/api/projects/${id}/fetch-drive`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({driveLink: link})});
    if(res.ok) { alert(`Fetch berhasil (${res.via}): ${res.count} foto`); loadProjects(); if(detailProject) openDetail(id); }
    else alert(res.message);
  }catch(e){ alert(e.message)}
}

async function deleteProject(id){
  const ok = await showConfirm('Hapus project ini?');
  if(!ok) return;
  await api(`/api/projects/${id}`, {method:'DELETE'});
  if(detailProject && detailProject.id===id){ document.getElementById('detailSection').style.display='none'; detailProject=null; }
  loadProjects();
}

async function openDetail(id){
  if(detailProject && detailProject.id===id){
    document.getElementById('detailSection').style.display='none';
    const oldBtn = document.getElementById('btnDetail_'+id);
    if(oldBtn){ oldBtn.classList.remove('gold'); oldBtn.classList.add('ghost'); }
    detailProject = null;
    return;
  }
  if(detailProject){
    const oldBtn = document.getElementById('btnDetail_'+detailProject.id);
    if(oldBtn){ oldBtn.classList.remove('gold'); oldBtn.classList.add('ghost'); }
  }
  const p = await api(`/api/projects/${id}`);
  detailProject = p;
  detailVisibleCount = 100;
  detailFilter = 'all';
  document.querySelectorAll('#detailFilters button').forEach(b=>b.classList.toggle('active', b.dataset.f==='all'));
  document.getElementById('detailSection').style.display='block';
  document.getElementById('detailTitle').textContent = `${p.clientName} — ${p.photos.length} foto • Maks ${p.maxSelection}`;
  const _selVals = Object.values(p.selections||{});
  document.getElementById('detailHint').textContent = `Terpilih ${ _selVals.filter(v=>selVal(v)===1).length}/${p.maxSelection}${ _selVals.filter(v=>selNote(v)).length ? ` • 📝 ${_selVals.filter(v=>selNote(v)).length} catatan` : ''}`;
  if(p.driveFolders){
    document.getElementById('folderLinks').innerHTML = `Folder Drive: <a href="${p.driveFolders.selected?`https://drive.google.com/drive/folders/${p.driveFolders.selected}`:'#'}" target="_blank">Terpilih</a> • Dipertimbangkan`;
  } else {
    document.getElementById('folderLinks').textContent = 'Belum ada folder Drive.';
  }
  const btn = document.getElementById('btnDetail_'+id);
  if(btn){ btn.classList.remove('ghost'); btn.classList.add('gold'); }
  const sel = p.selections || {};
  const selectedPhotos = p.photos.filter(ph => selVal(sel[ph.id]) === 1);
  const selectedBox = document.getElementById('selectedFiles');
  const selectedList = document.getElementById('selectedFilesList');
  if(selectedPhotos.length > 0){
    selectedList.innerHTML = selectedPhotos.map(ph => {
      const n = selNote(sel[ph.id]);
      return n ? `${esc(ph.filename)} — <span style="color:#8C0009">📝 ${esc(n)}</span>` : esc(ph.filename);
    }).join('<br>');
    selectedBox.style.display = 'block';
  } else {
    selectedBox.style.display = 'none';
  }
  const anyNotes = p.photos.filter(ph=> selVal(sel[ph.id])===1 && selNote(sel[ph.id]));
  if(anyNotes.length){
    let noteBox = document.getElementById('notesList');
    if(!noteBox){
      noteBox = document.createElement('div');
      noteBox.id='notesList';
      noteBox.style.cssText='margin-top:10px;background:#FFFBEB;border:1px solid #FDE68A;border-radius:8px;padding:10px;font-size:11px;line-height:1.6;max-height:220px;overflow:auto';
      document.getElementById('selectedFiles').after(noteBox);
    }
    noteBox.innerHTML = `<b style="font-size:11px;color:#92400E">📝 CATATAN CLIENT (${esc(anyNotes.length)} foto Dipilih):</b><br>` + anyNotes.map(ph=> `<span class="mono">${esc(ph.filename)}</span>: ${esc(selNote(sel[ph.id]))}`).join('<br>');
    noteBox.style.display='block';
  } else {
    const nb=document.getElementById('notesList'); if(nb) nb.style.display='none';
  }
  renderDetail();
  document.getElementById('detailSection').scrollIntoView({behavior:'smooth'});
}

function renderDetail(){
  if(!detailProject) return;
  const photos = detailProject.photos;
  const sel = detailProject.selections||{};
  const filtered = photos.filter(ph=>{
    const v = selVal(sel[ph.id]);
    if(detailFilter==='all') return true;
    return String(v)===String(detailFilter);
  });
  const gal = document.getElementById('detailGallery');
  if(filtered.length===0){
    gal.innerHTML = `<div class="hint" style="padding:24px;text-align:center">Tidak ada foto di filter ini.</div>`;
    return;
  }
  const visible = filtered.slice(0, detailVisibleCount);
  const hasMore = filtered.length > detailVisibleCount;
  gal.innerHTML = visible.map(ph=>{
    const v = selVal(sel[ph.id]);
    const note = (v===1 ? selNote(sel[ph.id]) : '');
    const cls = v===1?'selected':v===2?'considered':'';
    const dot = v===1?'<span class="status-dot s1">DIPILIH</span>':v===2?'<span class="status-dot s2">RAGU</span>':'';
    return `<div class="photo-card ${cls}">
      <img src="${esc(ph.url)}" loading="lazy"/>
      ${dot}
      <div style="padding:8px 10px">
        <div class="mono" style="font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(ph.filename)}</div>
        <div class="hint" style="font-size:11px">${v===1?'Dipilih':v===2?'Ragu':'Belum'}</div>
        ${note?`<div style="margin-top:6px;background:#FFFBEB;border:1px solid #FDE68A;border-radius:8px;padding:6px 8px;font-size:11px;line-height:1.4;color:#92400E">📝 ${esc(note)}</div>`:''}
      </div>
    </div>`;
  }).join('');
  if(hasMore){
    gal.innerHTML += `<div style="grid-column:1/-1;text-align:center;padding:16px"><button class="btn ghost small" onclick="detailVisibleCount+=100;renderDetail()">See More (${filtered.length - detailVisibleCount} lainnya)</button></div>`;
  }
}

document.getElementById('btnLogoutHidden') && (document.getElementById('btnLogoutHidden').onclick = async ()=>{ await fetch('/auth/logout',{method:'POST'}); checkAuth(); alert('Logout berhasil'); location.reload(); });
document.getElementById('btnRefresh').onclick = loadProjects;
document.getElementById('detailFilters').onclick = (e)=>{
  if(e.target.tagName!=='BUTTON') return;
  detailFilter = e.target.dataset.f;
  detailVisibleCount = 100;
  document.querySelectorAll('#detailFilters button').forEach(b=>b.classList.toggle('active', b.dataset.f===detailFilter));
  renderDetail();
};
document.getElementById('btnDownloadJson').onclick = ()=>{
  if(!detailProject) return;
  const blob = new Blob([JSON.stringify(detailProject, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`granads-${detailProject.id}.json`; a.click();
};
async function quickCreateFolders(id){
  try{
    const res = await api(`/api/projects/${id}/create-drive-folders`, {method:'POST'});
    alert(`Berhasil! Copied ${res.copied} + Uploaded ${res.uploaded}\n\nFolder:\n`+Object.entries(res.folders).map(([k,v])=>k+': '+v).join('\n'));
    loadProjects();
    if(detailProject && detailProject.id===id) openDetail(id);
  }catch(e){ alert(e.message) }
}
document.getElementById('btnCreateFolders').onclick = async ()=>{
  if(!detailProject) return;
  const btn = document.getElementById('btnCreateFolders');
  btn.disabled=true; btn.textContent='Membuat...';
  try{
    const res = await api(`/api/projects/${detailProject.id}/create-drive-folders`, {method:'POST'});
    alert(`Berhasil! Copied ${res.copied} + Uploaded ${res.uploaded}`);
    document.getElementById('folderLinks').innerHTML = Object.entries(res.folders).map(([k,v])=>`<a href="${v}" target="_blank">${k}</a>`).join(' • ');
    loadProjects();
  }catch(e){ alert(e.message)}
  finally{ btn.disabled=false; btn.textContent='Bikin Folder di Drive' }
};

checkAuth();
loadProjects();

let editLinkId = null;
function editDriveLink(id){
  editLinkId = id;
  const p = projects.find(x=>x.id===id);
  document.getElementById('editDriveLinkInput').value = p?.driveLink || '';
  document.getElementById('editLinkModal').style.display='flex';
}
async function saveDriveLink(){
  const link = document.getElementById('editDriveLinkInput').value.trim();
  if(!link) return alert('Link tidak boleh kosong');
  try{
    await api(`/api/projects/${editLinkId}/fetch-drive`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({driveLink: link})});
    document.getElementById('editLinkModal').style.display='none';
    alert('Link Drive berhasil diupdate!');
    loadProjects();
  }catch(e){ alert(e.message) }
}
</script>
</body>
</html>
